<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050a">
<meta name="color-scheme" content="dark">
<meta name="description" content="Clasuke Studio: visuales 3D infinitos que reaccionan a tu música, en vivo y para clips.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Clasuke Studio</title>
<script type="module" src="/src/main.js"></script>
</head>
<body>

<!-- icon sprite: one stroke weight, drawn on a 20px grid -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-bolt" viewBox="0 0 20 20"><path d="M11.5 1 3.5 11.5h5L7.5 19l9-11h-5.2z" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 20 20"><path d="M6 3.2v13.6a.6.6 0 0 0 .9.5l11-6.8a.6.6 0 0 0 0-1L6.9 2.7a.6.6 0 0 0-.9.5z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 20 20"><rect x="4" y="3" width="4.4" height="14" rx="1" fill="currentColor"/><rect x="11.6" y="3" width="4.4" height="14" rx="1" fill="currentColor"/></symbol>
    <symbol id="i-skip-b" viewBox="0 0 20 20"><path d="M15.5 4.2v11.6a.5.5 0 0 1-.8.4L7 10.4a.5.5 0 0 1 0-.8l7.7-5.8a.5.5 0 0 1 .8.4z" fill="currentColor"/><rect x="4" y="4" width="2" height="12" rx=".8" fill="currentColor"/></symbol>
    <symbol id="i-skip-f" viewBox="0 0 20 20"><path d="M4.5 4.2v11.6a.5.5 0 0 0 .8.4l7.7-5.8a.5.5 0 0 0 0-.8L5.3 3.8a.5.5 0 0 0-.8.4z" fill="currentColor"/><rect x="14" y="4" width="2" height="12" rx=".8" fill="currentColor"/></symbol>
    <symbol id="i-left" viewBox="0 0 20 20"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-right" viewBox="0 0 20 20"><path d="m7.5 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-star" viewBox="0 0 20 20"><path d="m10 2.4 2.3 4.9 5.3.7-3.9 3.7 1 5.3L10 14.4 5.3 17l1-5.3L2.4 8l5.3-.7z" fill="var(--fill, none)" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-wave" viewBox="0 0 20 20"><path d="M3 8v4M6.5 5v10M10 2.5v15M13.5 6v8M17 8.5v3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-music" viewBox="0 0 20 20"><path d="M7.5 15V4.5l9-2V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="5.2" cy="15" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="14.2" cy="13" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-mic" viewBox="0 0 20 20"><rect x="7.2" y="2" width="5.6" height="10" rx="2.8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 9.5a6 6 0 0 0 12 0M10 15.5V18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-pc" viewBox="0 0 20 20"><rect x="2" y="3.5" width="16" height="10.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 17.5h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-open" viewBox="0 0 20 20"><path d="M10 13V3M6 6.8 10 3l4 3.8M3 13v3.5h14V13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-down" viewBox="0 0 20 20"><path d="M10 3v10M6 9.2l4 3.8 4-3.8M3 16.5h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cmd" viewBox="0 0 20 20"><path d="M7.5 7.5h5v5h-5zM7.5 7.5V5.2a2.3 2.3 0 1 0-2.3 2.3zM12.5 7.5V5.2a2.3 2.3 0 1 1 2.3 2.3zM7.5 12.5v2.3a2.3 2.3 0 1 1-2.3-2.3zM12.5 12.5v2.3a2.3 2.3 0 1 0 2.3-2.3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-cast" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2" fill="currentColor"/><path d="M6 14a5.6 5.6 0 0 1 0-8M14 6a5.6 5.6 0 0 1 0 8M3.4 16.6a9.3 9.3 0 0 1 0-13.2M16.6 3.4a9.3 9.3 0 0 1 0 13.2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-full" viewBox="0 0 20 20"><path d="M3 7.5V3h4.5M17 7.5V3h-4.5M3 12.5V17h4.5M17 12.5V17h-4.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-dice" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7" cy="7" r="1.2" fill="currentColor"/><circle cx="13" cy="13" r="1.2" fill="currentColor"/><circle cx="10" cy="10" r="1.2" fill="currentColor"/><circle cx="13" cy="7" r="1.2" fill="currentColor"/><circle cx="7" cy="13" r="1.2" fill="currentColor"/></symbol>
    <symbol id="i-lock" viewBox="0 0 20 20"><rect x="4" y="9" width="12" height="8.5" rx="2" fill="currentColor"/><path d="M6.8 9V6.6a3.2 3.2 0 0 1 6.4 0V9" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-rec" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10" r="3.6" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 20 20"><path d="M10 4v12M4 10h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 20 20"><path d="m5.5 5.5 9 9M14.5 5.5l-9 9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 20 20"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m3 14 4.2-4.2 3.3 3.3 2.3-2.3L17 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="13" cy="7.5" r="1.3" fill="currentColor"/></symbol>
    <symbol id="i-cube" viewBox="0 0 20 20"><path d="m10 2 7 4v8l-7 4-7-4V6zM3 6l7 4 7-4M10 10v8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
    <symbol id="i-nocube" viewBox="0 0 20 20"><path d="m10 2 7 4v8l-7 4-7-4V6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" opacity=".5"/><path d="m3.5 16.5 13-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-style" viewBox="0 0 20 20"><circle cx="7.5" cy="8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12.5" cy="8" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="12.3" r="4.8" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-list" viewBox="0 0 20 20"><path d="M3 5h10M3 10h10M3 15h6M16 4.5v8.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="14.3" cy="13.6" r="1.9" fill="currentColor"/></symbol>
    <symbol id="i-drop" viewBox="0 0 20 20"><path d="M10 2.5v9M6.2 8 10 11.6 13.8 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12v2.5A2.5 2.5 0 0 0 5.500 17h9a2.500 2.500 0 0 0 2.500-2.500V12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <header class="top">
    <div class="brand" aria-label="Clasuke Studio">
      <svg class="brand-mark" id="brand-mark"><use href="#i-bolt"/></svg>
      <span class="brand-name">CLASUKE</span><span class="brand-sub">studio</span>
    </div>
    <div class="now" id="now" aria-live="polite">
      <span class="meter" id="meter" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="now-text" id="now-text"></span>
    </div>
    <div class="top-actions">
      <button class="tool tool-wide" id="btn-install" type="button" hidden><svg><use href="#i-down"/></svg><span data-i="install"></span></button>
      <button class="tool" id="btn-palette" type="button" data-it="commands"><svg><use href="#i-cmd"/></svg><kbd>K</kbd></button>
      <button class="tool" id="btn-stream" type="button" data-it="stream"><svg><use href="#i-cast"/></svg><kbd>H</kbd></button>
      <button class="tool" id="btn-full" type="button" data-it="full"><svg><use href="#i-full"/></svg><kbd>F</kbd></button>
      <div class="lang" role="group" data-ia="lang">
        <button type="button" data-lang="es" aria-label="Español">ES</button>
        <button type="button" data-lang="en" aria-label="English">EN</button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage-wrap">
    <div class="stage-fit" id="stage-fit">
      <div class="frame" id="frame">
        <canvas id="stage" aria-label="Visual"></canvas>
        <canvas id="gl" aria-label="Visual 3D" hidden></canvas>
        <div class="cut" id="cut" aria-hidden="true"></div>
        <div class="titlecard" id="titlecard" aria-hidden="true"><b id="tc-name"></b><span id="tc-code"></span></div>
        <div class="corners" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div class="rec-hud" id="rec-hud" hidden><i class="rec-dot"></i><b id="rec-time">0:00</b><span id="rec-meta"></span></div>
      </div>
    </div>

    <div class="firstrun" id="firstrun" hidden>
      <button class="fr-play" id="fr-play" type="button" data-ia="play"><svg><use href="#i-play"/></svg></button>
      <p class="fr-title" data-i="frPlay"></p>
      <ul class="fr-hints">
        <li><kbd data-i="frSpace"></kbd><span>play</span></li>
        <li><kbd>G</kbd><span data-i="frNew"></span></li>
        <li><svg><use href="#i-drop"/></svg><span data-i="frDrop"></span></li>
      </ul>
    </div>
    <div class="drop-veil" id="drop-veil" hidden><svg><use href="#i-drop"/></svg><span data-i="dropHere"></span></div>
    <div class="stream-hint" id="stream-hint" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <aside class="browser" id="browser" data-ia="browser">
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" type="button" id="tab-env" data-tab="env" aria-controls="pane-env"><svg><use href="#i-image"/></svg><span data-i="tabEnv"></span><i class="pip"></i></button>
      <button role="tab" type="button" id="tab-s3" data-tab="s3" aria-controls="pane-s3"><svg><use href="#i-cube"/></svg><span data-i="tab3d"></span><i class="pip"></i></button>
      <button role="tab" type="button" id="tab-style" data-tab="style" aria-controls="pane-style"><svg><use href="#i-style"/></svg><span data-i="tabStyle"></span><i class="pip"></i></button>
      <button role="tab" type="button" id="tab-songs" data-tab="songs" aria-controls="pane-songs"><svg><use href="#i-list"/></svg><span data-i="tabSongs"></span><i class="count" id="count-songs"></i></button>
      <button role="tab" type="button" id="tab-favs" data-tab="favs" aria-controls="pane-favs"><svg><use href="#i-star"/></svg><span data-i="tabFavs"></span><i class="count" id="count-favs"></i></button>
    </div>
    <div class="panes" id="panes">
      <section class="pane" id="pane-env" role="tabpanel" aria-labelledby="tab-env"></section>
      <section class="pane" id="pane-s3" role="tabpanel" aria-labelledby="tab-s3" hidden></section>
      <section class="pane" id="pane-style" role="tabpanel" aria-labelledby="tab-style" hidden></section>
      <section class="pane" id="pane-songs" role="tabpanel" aria-labelledby="tab-songs" hidden></section>
      <section class="pane" id="pane-favs" role="tabpanel" aria-labelledby="tab-favs" hidden></section>
    </div>
    <div class="tune">
      <div class="tune-row">
        <span class="lbl" data-i="format"></span>
        <div class="seg" role="group" data-ia="format" id="formats">
          <button type="button" data-ar="free" data-i="arFree"></button>
          <button type="button" data-ar="9:16"><i class="ar ar-916"></i>9:16</button>
          <button type="button" data-ar="16:9"><i class="ar ar-169"></i>16:9</button>
          <button type="button" data-ar="1:1"><i class="ar ar-11"></i>1:1</button>
        </div>
      </div>
      <label class="slider" for="k-int"><span class="lbl" data-i="intensity"></span><input id="k-int" type="range" min="30" max="200" value="100"><output id="o-int">100</output></label>
      <label class="slider" for="k-spd"><span class="lbl" data-i="speed"></span><input id="k-spd" type="range" min="30" max="200" value="100"><output id="o-spd">100</output></label>
      <div class="tune-row toggles">
        <button class="switch" id="btn-auto" type="button" aria-pressed="false" data-it="autoL"><i></i><span data-i="auto"></span><small>32</small></button>
        <button class="switch" id="btn-tag" type="button" aria-pressed="true" data-it="tagL"><i></i><span>@clasuke</span></button>
      </div>
    </div>
  </aside>

  <footer class="deck" data-ia="controls">
    <section class="deck-audio">
      <div class="transport">
        <button class="tbtn" id="btn-prev" type="button" data-it="prevSong"><svg><use href="#i-skip-b"/></svg></button>
        <button class="play" id="btn-play" type="button"><svg><use id="play-use" href="#i-play"/></svg></button>
        <button class="tbtn" id="btn-next" type="button" data-it="nextSong"><svg><use href="#i-skip-f"/></svg></button>
      </div>
      <div class="track">
        <div class="track-top">
          <span class="track-name" id="track-name"></span>
          <div class="src" role="group" data-ia="source" id="src-seg">
            <button type="button" data-src="demo" data-it="srcDemoL"><svg><use href="#i-wave"/></svg><span data-i="srcDemo"></span></button>
            <button type="button" data-src="songs" data-it="srcSongsL"><svg><use href="#i-music"/></svg><span data-i="srcSongs"></span></button>
            <button type="button" data-src="mic" data-it="srcMicL"><svg><use href="#i-mic"/></svg><span data-i="srcMic"></span></button>
            <button type="button" data-src="pc" data-it="srcPcL"><svg><use href="#i-pc"/></svg><span data-i="srcPc"></span></button>
            <label class="src-open" for="file" data-it="open" tabindex="0" role="button"><svg><use href="#i-open"/></svg></label>
          </div>
        </div>
        <div class="seek"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="t-dur">0:00</span></div>
      </div>
    </section>

    <section class="deck-visual">
      <div class="vnav">
        <button class="tbtn" id="v-prev" type="button" data-it="prevVis"><svg><use href="#i-left"/></svg></button>
        <button class="tbtn" id="v-next" type="button" data-it="nextVis"><svg><use href="#i-right"/></svg></button>
        <button class="tbtn fav" id="v-fav" type="button" data-it="fav" aria-pressed="false"><svg><use href="#i-star"/></svg></button>
      </div>
      <div class="vinfo">
        <div class="vname" id="vname"></div>
        <div class="vmeta"><input id="vcode" type="text" maxlength="7" spellcheck="false" autocomplete="off" autocapitalize="characters" data-ia="codeHint"><span id="vlayers"></span></div>
      </div>
      <button class="go" id="btn-gen" type="button"><svg><use href="#i-bolt"/></svg><span data-i="generate"></span><kbd>G</kbd></button>
      <button class="rec" id="btn-rec" type="button"><i class="rec-dot"></i><span id="rec-label" data-i="record"></span></button>
    </section>
  </footer>
</div>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-modal="true" data-ia="commands">
    <div class="palette-in"><svg><use href="#i-cmd"/></svg><input id="pal-input" type="text" spellcheck="false" autocomplete="off" data-ip="palHint" data-ia="palHint" role="combobox" aria-expanded="true" aria-controls="pal-list"><kbd>Esc</kbd></div>
    <ul class="palette-list" id="pal-list" role="listbox"></ul>
  </div>
</div>

<input id="file" type="file" accept="audio/*,video/*" multiple hidden>
<input id="bgfile" type="file" accept="image/*,video/*" hidden>
<noscript><p style="padding:24px;color:#f4efe9;font-family:system-ui">Clasuke Studio necesita JavaScript.</p></noscript>
</body>
</html>
