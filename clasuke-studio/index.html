<style>
/* Layout: full-window app. Header strip, the stage (canvas, letterboxed to the chosen format), a two-row dock. One night-time world, so a single dark theme. */
:root {
  --night: #07050a;
  --deck: #0f0c15;
  --deck-2: #17131f;
  --edge: #2a2236;
  --paper: #f4efe9;
  --ash: #9b93a8;
  --blood: #e0243a;
  --bolt: #8b5cff;
  --ice: #7fe3ff;
  --display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --body: "Outfit", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--night); }
body { margin: 0; color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, label:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

#app { height: 100%; min-height: 560px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
#app.stream .bar, #app.stream .dock { display: none; }
#app.stream { grid-template-rows: minmax(0, 1fr); }

/* header */
.bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--edge); background: var(--deck);
}
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 20px; letter-spacing: .04em; }
.logo svg { width: 22px; height: 22px; }
.logo small { font-family: var(--body); font-weight: 600; font-size: 12px; letter-spacing: .14em; color: var(--ash); text-transform: uppercase; }
.now { flex: 1 1 200px; min-width: 0; color: var(--ash); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now b { color: var(--paper); font-weight: 600; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  appearance: none; border: 1px solid var(--edge); background: var(--deck-2); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
}
.btn:hover { border-color: var(--ash); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn[aria-pressed="true"] { background: var(--paper); color: var(--night); border-color: var(--paper); }
.btn.rec { border-color: var(--blood); color: var(--paper); }
.btn.rec.on { background: var(--blood); }
.btn.mini { padding: 5px 10px; font-size: 12px; }

/* stage */
.stage-wrap { position: relative; display: grid; place-items: center; overflow: hidden; background: #000; min-height: 0; }
#stage, #gl { display: block; max-width: 100%; max-height: 100%; background: var(--night); }
.pick { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ash); }
.pick select { background: var(--deck-2); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 10px; font-size: 13px; font-weight: 600; color: var(--paper); max-width: 190px; }
.pick select:hover { border-color: var(--ash); }
.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
  background: rgba(15,12,21,.92); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; font-size: 14px;
  text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
}
.toast.show { opacity: 1; }
.rec-ind {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; font-family: var(--mono); font-size: 13px;
  background: var(--blood); color: var(--paper); padding: 4px 10px; border-radius: 999px;
}
.drop-veil {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,5,10,.8);
  font-family: var(--display); font-size: clamp(22px, 4vw, 40px); border: 3px dashed var(--blood);
}
.stream-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--ash); background: rgba(7,5,10,.7); padding: 4px 12px; border-radius: 999px; transition: opacity .4s; }

/* dock */
.dock {
  display: grid; gap: 10px; background: var(--deck); border-top: 1px solid var(--edge);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sep { width: 1px; height: 26px; background: var(--edge); }

.play {
  appearance: none; border: 0; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; flex: none;
  background: var(--paper); color: var(--night); display: grid; place-items: center;
}
.play svg { width: 18px; height: 18px; }
.icon-btn { appearance: none; border: 1px solid var(--edge); background: var(--deck-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { border-color: var(--ash); }
.icon-btn[aria-pressed="true"] { color: var(--bass, #ffd166); border-color: #ffd166; }

.seek { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--ash); font-variant-numeric: tabular-nums; }
.seek input { flex: 1; min-width: 0; accent-color: var(--blood); }

.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--deck-2); }
.seg button { appearance: none; border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ash); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--night); }

.gen {
  appearance: none; border: 0; cursor: pointer; border-radius: 14px; padding: 10px 18px;
  background: var(--blood); color: var(--paper); font-family: var(--display); font-size: 16px; letter-spacing: .03em;
  display: inline-flex; align-items: center; gap: 10px; flex: none;
}
.gen svg { width: 20px; height: 20px; }
.gen:hover { filter: brightness(1.1); }
.vinfo { display: grid; gap: 2px; min-width: 0; flex: 1 1 180px; }
.vname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vcode { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ash); min-width: 0; white-space: nowrap; }
.vcode #vlayers { overflow: hidden; text-overflow: ellipsis; }
.vcode input { width: 92px; background: var(--deck-2); border: 1px solid var(--edge); border-radius: 6px; padding: 2px 6px; font-family: var(--mono); font-size: 12px; text-transform: uppercase; }
.knob { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ash); }
.knob input { width: 76px; accent-color: var(--bolt); }

.chips { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1 1 200px; scrollbar-width: thin; padding-bottom: 2px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--edge); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; background: var(--deck-2); cursor: pointer; max-width: 220px; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.on { border-color: var(--blood); }
.chip i { font-style: normal; color: var(--ash); padding: 0 4px; border-radius: 50%; }
.chip i:hover { color: var(--paper); }
.label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); flex: none; }
.empty { font-size: 12px; color: var(--ash); }
.keys { font-size: 12px; color: var(--ash); }
.keys kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--edge); border-radius: 4px; padding: 0 4px; color: var(--paper); }

@media (max-width: 760px) {
  #app { height: auto; min-height: 100%; grid-template-rows: auto 62vh auto; }
  .sep, .keys { display: none; }
  .gen { flex: 1 1 auto; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<body>

<div id="app">
  <header class="bar">
    <div class="logo">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M13 1 4 13h6l-2 8 10-13h-6l2-7z" fill="var(--blood)"/></svg>
      CLASUKE <small>studio</small>
    </div>
    <div class="now" id="now"></div>
    <div class="bar-actions">
      <button class="btn" id="btn-install" type="button" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2 13h12"/></svg><span data-i="install"></span></button>
      <button class="btn" id="btn-stream" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1.5" y="3" width="13" height="10" rx="2"/><circle cx="8" cy="8" r="2"/></svg><span data-i="stream"></span></button>
      <button class="btn" id="btn-full" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg><span data-i="full"></span></button>
      <button class="btn" id="btn-lang" type="button">EN</button>
    </div>
  </header>

  <main class="stage-wrap" id="stage-wrap">
    <canvas id="stage" aria-label="Visual"></canvas>
    <canvas id="gl" aria-label="Visual 3D" hidden></canvas>
    <div class="rec-ind" id="rec-ind" hidden>REC 0:00</div>
    <div class="drop-veil" id="drop-veil" hidden><span data-i="dropHere"></span></div>
    <div class="stream-hint" id="stream-hint" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <section class="dock" aria-label="Controls">
    <div class="row">
      <div class="group">
        <button class="icon-btn" id="btn-prev" type="button" data-it="prevSong"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z" fill="currentColor"/></svg></button>
        <button class="play" id="btn-play" type="button"><svg id="play-ico" viewBox="0 0 18 18"></svg></button>
        <button class="icon-btn" id="btn-next" type="button" data-it="nextSong"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z" fill="currentColor"/></svg></button>
      </div>
      <div class="seek"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="t-dur">0:00</span></div>
      <div class="seg" role="group" aria-label="Audio">
        <button type="button" data-src="demo" data-i="srcDemo"></button>
        <button type="button" data-src="songs" data-i="srcSongs"></button>
        <button type="button" data-src="mic" data-i="srcMic"></button>
        <button type="button" data-src="pc" data-i="srcPc"></button>
      </div>
      <label class="btn" for="file"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 11v3h12v-3"/></svg><span data-i="open"></span></label>
      <input id="file" type="file" accept="audio/*,video/*" multiple hidden>
    </div>

    <div class="row">
      <button class="gen" id="btn-gen" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M11 1 3 12h6l-1 7 9-11h-6z"/></svg><span data-i="generate"></span></button>
      <button class="btn rec" id="btn-rec" type="button"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg><span id="rec-label" data-i="record"></span></button>
      <div class="group">
        <button class="icon-btn" id="v-prev" type="button" data-it="prevVis"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="icon-btn" id="v-next" type="button" data-it="nextVis"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 3 5 5-5 5"/></svg></button>
        <button class="icon-btn" id="v-fav" type="button" data-it="fav" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="m8 1.5 2 4.3 4.6.5-3.4 3.1 1 4.6L8 11.6 3.8 14l1-4.6L1.4 6.3 6 5.8z" fill="currentColor"/></svg></button>
      </div>
      <div class="vinfo">
        <div class="vname" id="vname"></div>
        <div class="vcode"><span data-i="code"></span><input id="vcode" type="text" maxlength="8" spellcheck="false" aria-label="Visual code"><span id="vlayers"></span></div>
      </div>
      <span class="sep"></span>
      <button class="btn" id="btn-auto" type="button" aria-pressed="false"><span data-i="auto"></span></button>
      <div class="seg" role="group" aria-label="Format">
        <button type="button" data-ar="free" data-i="arFree"></button>
        <button type="button" data-ar="9:16">9:16</button>
        <button type="button" data-ar="16:9">16:9</button>
        <button type="button" data-ar="1:1">1:1</button>
      </div>
    </div>

    <div class="row">
      <label class="pick" for="sel-env"><span data-i="bgLabel"></span><select id="sel-env"></select></label>
      <label class="pick" for="sel-3d"><span>3D</span><select id="sel-3d"></select></label>
      <label class="pick" for="sel-style"><span data-i="styleLabel"></span><select id="sel-style"></select></label>
      <label class="btn mini" for="bgfile"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg><span data-i="myBg"></span></label>
      <input id="bgfile" type="file" accept="image/*,video/*" hidden>
      <span class="sep"></span>
      <label class="knob" for="k-int"><span data-i="intensity"></span><input id="k-int" type="range" min="30" max="200" value="100"></label>
      <label class="knob" for="k-spd"><span data-i="speed"></span><input id="k-spd" type="range" min="30" max="200" value="100"></label>
      <button class="btn" id="btn-tag" type="button" aria-pressed="true">@clasuke</button>
    </div>

    <div class="row">
      <span class="label" data-i="playlist"></span>
      <div class="chips" id="playlist"></div>
      <span class="label" data-i="favs"></span>
      <div class="chips" id="favs"></div>
    </div>
    <div class="keys" id="keys"></div>
  </section>
</div>

      playing = true; updatePlayBtn(); updateNowPlaying();

      ? '<rect x="3" y="2" width="4" height="14" rx="1" fill="currentColor"/><rect x="11" y="2" width="4" height="14" rx="1" fill="currentColor"/>'
      : '<path d="M4 2l12 7-12 7z" fill="currentColor"/>';
    const lb = t(playing ? 'pause' : 'play'); $('#btn-play').setAttribute('aria-label', lb); $('#btn-play').title = lb;
  }
  function nowTitle() {
    if (source === 'songs' && playlist[curTrack]) return playlist[curTrack].name;
    if (source === 'demo') return playing ? t('demoName') : '';
    return '';
  }
  function updateNowPlaying() {
    const el = $('#now'); let txt = '';
    if (!playing) txt = '<span>' + t('idle') + '</span>';
    else if (source === 'mic') txt = '<b>' + t('mic') + '</b>';
    else if (source === 'pc') txt = '<b>' + t('pc') + '</b>';
    else { txt = t('playing') + ' · <b></b>'; }
    el.innerHTML = txt; const b = el.querySelector('b'); if (b && playing && (source === 'songs' || source === 'demo')) b.textContent = nowTitle();
  }

  // ================= analysis =================
  const pk = { bass: .3, mid: .3, high: .3 }; let fluxAvg = 0, lastBeat = 0, idleBeatPh = 0; const prevLow = new Float32Array(16);
  function bandAvg(lo, hi) {
    const hz = ac.sampleRate / an.fftSize, a = Math.max(1, Math.floor(lo / hz)), b = Math.min(A.spec.length - 1, Math.ceil(hi / hz)); let s = 0;
    for (let i = a; i <= b; i++) s += A.spec[i]; return s / ((b - a + 1) * 255);
  }
  function analyse(dt, now) {
    A.beat = false;
    const live = ac && playing;
    if (live) {
      an.getByteFrequencyData(A.spec); an.getFloatTimeDomainData(A.wave);
      const bass = bandAvg(30, 160), mid = bandAvg(250, 2000), high = bandAvg(3000, 12000);
      let e = 0; for (let i = 0; i < A.wave.length; i += 4) e += A.wave[i] * A.wave[i]; const lvl = Math.sqrt(e / (A.wave.length / 4));
      const decay = Math.pow(.92, dt);
      pk.bass = Math.max(pk.bass * decay, bass, .12); pk.mid = Math.max(pk.mid * decay, mid, .08); pk.high = Math.max(pk.high * decay, high, .05);
      A.bass += (bass / pk.bass - A.bass) * .5; A.mid += (mid / pk.mid - A.mid) * .4; A.high += (high / pk.high - A.high) * .5;
      A.level += (Math.min(1, lvl * 3) - A.level) * .3;
      let flux = 0; for (let i = 1; i < 16; i++) { const v = A.spec[i]; const d = v - prevLow[i]; if (d > 0) flux += d; prevLow[i] = v; }
      flux /= 15 * 255;
      if (flux > fluxAvg * 1.8 + .02 && bass > .12 && now - lastBeat > .2) { A.beat = true; lastBeat = now; }
      fluxAvg += (flux - fluxAvg) * Math.min(1, dt * 2.5);
    } else {
      // no audio: a slow built-in pulse keeps the visual alive
      const per = 60 / 92, prev = idleBeatPh; idleBeatPh = (now % per) / per; if (idleBeatPh < prev) A.beat = true;
      A.bass = Math.exp(-idleBeatPh * 5) * .85; A.mid = .35 + .15 * Math.sin(now * 1.3); A.high = .25 + .2 * Math.pow(Math.sin(now * 3.1), 2); A.level = .3 + A.bass * .3;
      for (let i = 0; i < A.spec.length; i++) {
        const v = 210 * Math.exp(-i / 40) * (.35 + A.bass * .65) + 110 * Math.exp(-Math.pow((i - 120) / 70, 2)) * (.4 + A.mid) + 60 * (.5 + .5 * Math.sin(i * .09 + now * 2)) * Math.exp(-i / 260) * (.5 + A.high);
        A.spec[i] = v > 255 ? 255 : v;
      }
      for (let i = 0; i < A.wave.length; i++) A.wave[i] = Math.sin(i * .021 + now * 5) * .28 * (.5 + A.bass) + Math.sin(i * .113 + now * 9) * .08 * A.high;
    }
    if (A.beat) { A.beats++; A.beatPulse = 1; if (auto && A.beats % 32 === 0) nextVisual(); }
    else A.beatPulse = Math.max(0, A.beatPulse - dt * 4);
  }

  // ================= recording =================
  let rec = null, recChunks = [], recStart = 0, recExt = 'webm', saver = null;
  // inside claude.ai the viewer's own save prompt hands over the video; elsewhere a normal download
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(x => { saver = x; }).catch(() => {}); } catch (e) {}
  function pickMime() {
    const opts = [['video/mp4;codecs=avc1.640028,mp4a.40.2', 'mp4'], ['video/mp4;codecs=avc1,mp4a.40.2', 'mp4'], ['video/webm;codecs=vp9,opus', 'webm'], ['video/webm', 'webm'], ['video/mp4', 'mp4']];
    for (const [m, ext] of opts) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return [m, ext];
    return null;
  }
  function startRec() {
    if (inFrame && !saver) { toast(t('recFrame'), 5000); return; }
    if (!cv.captureStream || !window.MediaRecorder) { toast(t('recNo')); return; }
    const mm = pickMime(); if (!mm) { toast(t('recNo')); return; }
    ensureAudio(); ac.resume();
    if (EXPORT[aspect]) { const [w, h] = EXPORT[aspect]; setSize(w, h); }
    recording = true;
    const recCanvas = GL ? GL.canvas : cv;
    const vs = recCanvas.captureStream(60), tracks = vs.getVideoTracks().concat(recDest.stream.getAudioTracks());
    recChunks = []; recExt = mm[1];
    try { rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mm[0], videoBitsPerSecond: 14e6, audioBitsPerSecond: 192e3 }); }
    catch (e) { recording = false; layout(); toast(t('recNo')); return; }
    rec.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    rec.onstop = () => {
      const blob = new Blob(recChunks, { type: mm[0].split(';')[0] });
      const d = new Date(), stamp = d.getFullYear() + '' + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
      const filename = 'clasuke-' + cur.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-') + '-' + stamp + '.' + recExt;
      if (saver) {
        saver.save({ filename, data: blob }).then(() => toast(t('recSaved'))).catch(e => { if (!e || e.code !== 'declined') toast(t('recFrame'), 5000); });
        return;
      }
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
      toast(t('recSaved'));
    };
    rec.start(500); recStart = performance.now();
    $('#btn-rec').classList.add('on'); $('#rec-label').dataset.i = 'stop'; $('#rec-label').textContent = t('stop'); $('#rec-ind').hidden = false;
  }
  function stopRec() {
    if (!rec) return; rec.stop(); rec = null; recording = false; layout();
    $('#btn-rec').classList.remove('on'); $('#rec-label').dataset.i = 'record'; $('#rec-label').textContent = t('record'); $('#rec-ind').hidden = true;
  }

  // ================= UI wiring =================
  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(e => { e.textContent = t(e.dataset.i); });
    document.querySelectorAll('[data-it]').forEach(e => { e.title = t(e.dataset.it); e.setAttribute('aria-label', t(e.dataset.it)); });
    $('#keys').innerHTML = t('keys');
    $('#btn-lang').textContent = lang === 'es' ? 'EN' : 'ES';
    $('#btn-lang').setAttribute('aria-label', lang === 'es' ? 'English' : 'Español');
    updatePlayBtn(); updateNowPlaying(); renderVisualInfo(); renderPlaylist();
  }
  $('#btn-lang').addEventListener('click', () => { lang = lang === 'es' ? 'en' : 'es'; store.set('cs-lang', lang); applyLang(); });
  $('#btn-play').addEventListener('click', togglePlay);
  $('#btn-prev').addEventListener('click', () => { if (source === 'songs' && playlist.length) playTrack((curTrack - 1 + playlist.length) % playlist.length); });
  $('#btn-next').addEventListener('click', () => { if (source === 'songs' && playlist.length) playTrack((curTrack + 1) % playlist.length); });
  document.querySelectorAll('[data-src]').forEach(b => b.addEventListener('click', () => setSource(b.dataset.src)));
  $('#file').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  $('#btn-gen').addEventListener('click', () => setVisual(newSeed()));
  $('#v-next').addEventListener('click', nextVisual);
  $('#v-prev').addEventListener('click', prevVisual);
  $('#v-fav').addEventListener('click', toggleFav);
  $('#vcode').addEventListener('keydown', e => {
    if (e.key === 'Enter') { const s = seedOf(e.target.value); if (s == null) toast(t('badCode')); else { setVisual(s); e.target.blur(); } }
    if (e.key === 'Escape') { e.target.value = cur.code; e.target.blur(); }
  });
  $('#vcode').addEventListener('blur', e => { e.target.value = cur.code; });
  $('#btn-auto').addEventListener('click', e => { auto = !auto; e.currentTarget.setAttribute('aria-pressed', auto); if (auto) toast(t('autoOn')); });
  document.querySelectorAll('[data-ar]').forEach(b => b.addEventListener('click', () => { if (recording) return; aspect = b.dataset.ar; store.set('cs-ar', aspect); markAspect(); layout(); }));
  function markAspect() { document.querySelectorAll('[data-ar]').forEach(b => b.setAttribute('aria-pressed', b.dataset.ar === aspect ? 'true' : 'false')); }
  $('#k-int').addEventListener('input', e => { intensity = e.target.value / 100; });
  $('#k-spd').addEventListener('input', e => { speed = e.target.value / 100; });
  $('#btn-tag').addEventListener('click', e => { showTag = !showTag; store.set('cs-tag', showTag); e.currentTarget.setAttribute('aria-pressed', showTag); });
  $('#btn-tag').setAttribute('aria-pressed', showTag);
  $('#btn-rec').addEventListener('click', () => rec ? stopRec() : startRec());

  const seek = $('#seek');
  let seeking = false;
  seek.addEventListener('input', () => { seeking = true; });
  seek.addEventListener('change', () => { if (source === 'songs' && mediaEl && isFinite(mediaEl.duration)) mediaEl.currentTime = seek.value / 1000 * mediaEl.duration; seeking = false; });
  const fmt = s => { if (!isFinite(s)) return '0:00'; s = Math.max(0, s | 0); return (s / 60 | 0) + ':' + String(s % 60).padStart(2, '0'); };

  function setStream(on) {
    $('#app').classList.toggle('stream', on);
    const h = $('#stream-hint'); if (on) { h.textContent = t('streamHint'); h.hidden = false; h.style.opacity = 1; setTimeout(() => { h.style.opacity = 0; }, 2200); setTimeout(() => { h.hidden = true; }, 2700); }
    requestAnimationFrame(layout);
  }
  $('#btn-stream').addEventListener('click', () => setStream(true));
  function toggleFull() {
    if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
    const el = document.documentElement; if (!el.requestFullscreen) { toast(t('fullNo')); return; }
    el.requestFullscreen().catch(() => toast(t('fullNo')));
  }
  $('#btn-full').addEventListener('click', toggleFull);
  document.addEventListener('fullscreenchange', () => requestAnimationFrame(layout));

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.target.type === 'text') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); togglePlay(); }
    else if (k === 'g') setVisual(newSeed());
    else if (k === 'arrowright') nextVisual();
    else if (k === 'arrowleft') prevVisual();
    else if (k === 's') toggleFav();
    else if (k === 'h') setStream(!$('#app').classList.contains('stream'));
    else if (k === 'escape' && $('#app').classList.contains('stream')) setStream(false);
    else if (k === 'f') toggleFull();
    else if (k === 'r') rec ? stopRec() : startRec();
  });

  // drag and drop
  let dragDepth = 0;
  window.addEventListener('dragenter', e => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; $('#drop-veil').hidden = false; } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop-veil').hidden = true; });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; $('#drop-veil').hidden = true; if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

  // install prompt (works when the app is opened from its web address in Chrome or Edge)
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; $('#btn-install').hidden = false; });
  $('#btn-install').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $('#btn-install').hidden = true; });


  // ================= pickers: background, 3D, style =================
  function fillSelect(sel, opts, value) {
    sel.innerHTML = '';
    opts.forEach(([v, label]) => { const o = document.createElement('option'); o.value = v; o.textContent = label; sel.appendChild(o); });
    sel.value = value;
  }
  function syncPickers() {
    const L = lang === 'es' ? 0 : 1, rnd = '🎲 ' + t('random');
    fillSelect($('#sel-env'), [['auto', rnd]].concat(ENVS.map(e => [e.id, lang === 'es' ? e.es : e.en])), lock.env);
    fillSelect($('#sel-3d'), [['auto', rnd], ['none', S3_NAMES.none[L]]].concat(S3_KEYS.map(k => [k, S3_NAMES[k][L]])), lock.s3);
    fillSelect($('#sel-style'), [['auto', rnd]].concat(STYLE_KEYS.map(k => [k, STYLES[k].n[L]])), lock.style);
    ['#sel-env', '#sel-3d', '#sel-style'].forEach(id => { $(id).disabled = !GL; });
  }
  function setLock(kind, v) {
    lock[kind] = v; store.set('cs-lock', { env: lock.env.startsWith('u') ? 'auto' : lock.env, s3: lock.s3, style: lock.style });
    setVisual(cur.seed, false);
  }
  $('#sel-env').addEventListener('change', e => setLock('env', e.target.value));
  $('#sel-3d').addEventListener('change', e => setLock('s3', e.target.value));
  $('#sel-style').addEventListener('change', e => setLock('style', e.target.value));
  let userBg = 0;
  $('#bgfile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; e.target.value = ''; if (!f) return;
    if (!GL) { toast(t('no3d')); return; }
    const isVid = /^video\//.test(f.type), id = 'u' + (++userBg), nm = f.name.replace(/\.[^.]+$/, '').slice(0, 24);
    ENVS.push({ id, type: isVid ? 'video' : 'image', src: URL.createObjectURL(f), es: t('yourBg') + ': ' + nm, en: 'Your background: ' + nm });
    setLock('env', id);
  });
  // ================= boot =================
  const startCode = (location.hash.length > 1 && seedOf(location.hash.slice(1)) != null) ? location.hash.slice(1) : store.get('cs-last', null);
  setVisual(startCode && seedOf(startCode) != null ? seedOf(startCode) : newSeed());
  markAspect();
  document.querySelectorAll('[data-src]').forEach(b => b.setAttribute('aria-pressed', b.dataset.src === 'demo' ? 'true' : 'false'));
  applyLang();
  layout();
  init3D().then(api => {
    if (!api) { toast(t('no3d'), 3500); return; }
    GL = api; cv.hidden = true; api.canvas.hidden = false;
    const w = cv.width, h = cv.height; cv.width = cv.height = 2; layout(); if (cv.width === 2) setSize(w, h);
    setVisual(cur.seed, false);
  }).catch(err => { console.warn('3D unavailable', err); });

  let lastNow = performance.now(), recTick = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - lastNow) / 1000); lastNow = now;
    analyse(dt, now / 1000);
    render(dt);
    if (source === 'songs' && mediaEl && !seeking) {
      const d = mediaEl.duration; seek.value = isFinite(d) && d > 0 ? Math.round(mediaEl.currentTime / d * 1000) : 0;
      $('#t-cur').textContent = fmt(mediaEl.currentTime); $('#t-dur').textContent = fmt(d);
    } else if (source !== 'songs') { seek.value = 0; $('#t-cur').textContent = '0:00'; $('#t-dur').textContent = source === 'demo' ? '∞' : 'live'; }
    if (rec && now - recTick > 250) { recTick = now; $('#rec-ind').textContent = 'REC ' + fmt((now - recStart) / 1000); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
