<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07050a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Clasuke Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: full-window app. Header strip, the stage (canvas, letterboxed to the chosen format), a two-row dock. One night-time world, so a single dark theme. */
:root {
  --night: #07050a;
  --deck: #0f0c15;
  --deck-2: #17131f;
  --edge: #2a2236;
  --paper: #f4efe9;
  --ash: #9b93a8;
  --blood: #e0243a;
  --bolt: #8b5cff;
  --ice: #7fe3ff;
  --display: "Dela Gothic One", "Arial Black", Impact, system-ui, sans-serif;
  --body: "Outfit", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--night); }
body { margin: 0; color: var(--paper); font-family: var(--body); font-size: 15px; line-height: 1.4; }
button, input, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, label:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }

#app { height: 100%; min-height: 560px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
#app.stream .bar, #app.stream .dock { display: none; }
#app.stream { grid-template-rows: minmax(0, 1fr); }

/* header */
.bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--edge); background: var(--deck);
}
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-size: 20px; letter-spacing: .04em; }
.logo svg { width: 22px; height: 22px; }
.logo small { font-family: var(--body); font-weight: 600; font-size: 12px; letter-spacing: .14em; color: var(--ash); text-transform: uppercase; }
.now { flex: 1 1 200px; min-width: 0; color: var(--ash); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now b { color: var(--paper); font-weight: 600; }
.bar-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  appearance: none; border: 1px solid var(--edge); background: var(--deck-2); border-radius: 999px;
  padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
}
.btn:hover { border-color: var(--ash); }
.btn svg { width: 15px; height: 15px; flex: none; }
.btn[aria-pressed="true"] { background: var(--paper); color: var(--night); border-color: var(--paper); }
.btn.rec { border-color: var(--blood); color: var(--paper); }
.btn.rec.on { background: var(--blood); }
.btn.mini { padding: 5px 10px; font-size: 12px; }

/* stage */
.stage-wrap { position: relative; display: grid; place-items: center; overflow: hidden; background: #000; min-height: 0; }
#stage { display: block; max-width: 100%; max-height: 100%; background: var(--night); }
.toast {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(560px, calc(100% - 32px));
  background: rgba(15,12,21,.92); border: 1px solid var(--edge); border-radius: 12px; padding: 10px 14px; font-size: 14px;
  text-align: center; pointer-events: none; opacity: 0; transition: opacity .25s;
}
.toast.show { opacity: 1; }
.rec-ind {
  position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: 14px; font-family: var(--mono); font-size: 13px;
  background: var(--blood); color: var(--paper); padding: 4px 10px; border-radius: 999px;
}
.drop-veil {
  position: absolute; inset: 0; display: grid; place-items: center; background: rgba(7,5,10,.8);
  font-family: var(--display); font-size: clamp(22px, 4vw, 40px); border: 3px dashed var(--blood);
}
.stream-hint { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 13px; color: var(--ash); background: rgba(7,5,10,.7); padding: 4px 12px; border-radius: 999px; transition: opacity .4s; }

/* dock */
.dock {
  display: grid; gap: 10px; background: var(--deck); border-top: 1px solid var(--edge);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.sep { width: 1px; height: 26px; background: var(--edge); }

.play {
  appearance: none; border: 0; cursor: pointer; width: 48px; height: 48px; border-radius: 50%; flex: none;
  background: var(--paper); color: var(--night); display: grid; place-items: center;
}
.play svg { width: 18px; height: 18px; }
.icon-btn { appearance: none; border: 1px solid var(--edge); background: var(--deck-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn:hover { border-color: var(--ash); }
.icon-btn[aria-pressed="true"] { color: var(--bass, #ffd166); border-color: #ffd166; }

.seek { display: flex; align-items: center; gap: 8px; flex: 1 1 220px; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--ash); font-variant-numeric: tabular-nums; }
.seek input { flex: 1; min-width: 0; accent-color: var(--blood); }

.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 999px; overflow: hidden; background: var(--deck-2); }
.seg button { appearance: none; border: 0; background: transparent; padding: 7px 12px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ash); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--night); }

.gen {
  appearance: none; border: 0; cursor: pointer; border-radius: 14px; padding: 10px 18px;
  background: var(--blood); color: var(--paper); font-family: var(--display); font-size: 16px; letter-spacing: .03em;
  display: inline-flex; align-items: center; gap: 10px; flex: none;
}
.gen svg { width: 20px; height: 20px; }
.gen:hover { filter: brightness(1.1); }
.vinfo { display: grid; gap: 2px; min-width: 0; flex: 1 1 180px; }
.vname { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vcode { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ash); min-width: 0; white-space: nowrap; }
.vcode #vlayers { overflow: hidden; text-overflow: ellipsis; }
.vcode input { width: 92px; background: var(--deck-2); border: 1px solid var(--edge); border-radius: 6px; padding: 2px 6px; font-family: var(--mono); font-size: 12px; text-transform: uppercase; }
.knob { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ash); }
.knob input { width: 76px; accent-color: var(--bolt); }

.chips { display: flex; gap: 6px; overflow-x: auto; min-width: 0; flex: 1 1 200px; scrollbar-width: thin; padding-bottom: 2px; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--edge); border-radius: 999px; padding: 4px 6px 4px 10px; font-size: 12px; background: var(--deck-2); cursor: pointer; max-width: 220px; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.on { border-color: var(--blood); }
.chip i { font-style: normal; color: var(--ash); padding: 0 4px; border-radius: 50%; }
.chip i:hover { color: var(--paper); }
.label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ash); flex: none; }
.empty { font-size: 12px; color: var(--ash); }
.keys { font-size: 12px; color: var(--ash); }
.keys kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--edge); border-radius: 4px; padding: 0 4px; color: var(--paper); }

@media (max-width: 760px) {
  #app { height: auto; min-height: 100%; grid-template-rows: auto 62vh auto; }
  .sep, .keys { display: none; }
  .gen { flex: 1 1 auto; justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<div id="app">
  <header class="bar">
    <div class="logo">
      <svg viewBox="0 0 22 22" aria-hidden="true"><path d="M13 1 4 13h6l-2 8 10-13h-6l2-7z" fill="var(--blood)"/></svg>
      CLASUKE <small>studio</small>
    </div>
    <div class="now" id="now"></div>
    <div class="bar-actions">
      <button class="btn" id="btn-install" type="button" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M2 13h12"/></svg><span data-i="install"></span></button>
      <button class="btn" id="btn-stream" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="1.5" y="3" width="13" height="10" rx="2"/><circle cx="8" cy="8" r="2"/></svg><span data-i="stream"></span></button>
      <button class="btn" id="btn-full" type="button"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg><span data-i="full"></span></button>
      <button class="btn" id="btn-lang" type="button">EN</button>
    </div>
  </header>

  <main class="stage-wrap" id="stage-wrap">
    <canvas id="stage" aria-label="Visual"></canvas>
    <div class="rec-ind" id="rec-ind" hidden>REC 0:00</div>
    <div class="drop-veil" id="drop-veil" hidden><span data-i="dropHere"></span></div>
    <div class="stream-hint" id="stream-hint" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <section class="dock" aria-label="Controls">
    <div class="row">
      <div class="group">
        <button class="icon-btn" id="btn-prev" type="button" data-it="prevSong"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z" fill="currentColor"/></svg></button>
        <button class="play" id="btn-play" type="button"><svg id="play-ico" viewBox="0 0 18 18"></svg></button>
        <button class="icon-btn" id="btn-next" type="button" data-it="nextSong"><svg viewBox="0 0 16 16"><path d="M11 2h2v12h-2zM2 2v12l8-6z" fill="currentColor"/></svg></button>
      </div>
      <div class="seek"><span id="t-cur">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek"><span id="t-dur">0:00</span></div>
      <div class="seg" role="group" aria-label="Audio">
        <button type="button" data-src="demo" data-i="srcDemo"></button>
        <button type="button" data-src="songs" data-i="srcSongs"></button>
        <button type="button" data-src="mic" data-i="srcMic"></button>
        <button type="button" data-src="pc" data-i="srcPc"></button>
      </div>
      <label class="btn" for="file"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2 11v3h12v-3"/></svg><span data-i="open"></span></label>
      <input id="file" type="file" accept="audio/*,video/*" multiple hidden>
    </div>

    <div class="row">
      <button class="gen" id="btn-gen" type="button"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M11 1 3 12h6l-1 7 9-11h-6z"/></svg><span data-i="generate"></span></button>
      <button class="btn rec" id="btn-rec" type="button"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="5" fill="currentColor"/></svg><span id="rec-label" data-i="record"></span></button>
      <div class="group">
        <button class="icon-btn" id="v-prev" type="button" data-it="prevVis"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 3 5 8l5 5"/></svg></button>
        <button class="icon-btn" id="v-next" type="button" data-it="nextVis"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 3 5 5-5 5"/></svg></button>
        <button class="icon-btn" id="v-fav" type="button" data-it="fav" aria-pressed="false"><svg viewBox="0 0 16 16"><path d="m8 1.5 2 4.3 4.6.5-3.4 3.1 1 4.6L8 11.6 3.8 14l1-4.6L1.4 6.3 6 5.8z" fill="currentColor"/></svg></button>
      </div>
      <div class="vinfo">
        <div class="vname" id="vname"></div>
        <div class="vcode"><span data-i="code"></span><input id="vcode" type="text" maxlength="8" spellcheck="false" aria-label="Visual code"><span id="vlayers"></span></div>
      </div>
      <span class="sep"></span>
      <button class="btn" id="btn-auto" type="button" aria-pressed="false"><span data-i="auto"></span></button>
      <div class="seg" role="group" aria-label="Format">
        <button type="button" data-ar="free" data-i="arFree"></button>
        <button type="button" data-ar="9:16">9:16</button>
        <button type="button" data-ar="16:9">16:9</button>
        <button type="button" data-ar="1:1">1:1</button>
      </div>
      <label class="knob" for="k-int"><span data-i="intensity"></span><input id="k-int" type="range" min="30" max="200" value="100"></label>
      <label class="knob" for="k-spd"><span data-i="speed"></span><input id="k-spd" type="range" min="30" max="200" value="100"></label>
      <button class="btn" id="btn-tag" type="button" aria-pressed="true">@clasuke</button>
    </div>

    <div class="row">
      <span class="label" data-i="playlist"></span>
      <div class="chips" id="playlist"></div>
      <span class="label" data-i="favs"></span>
      <div class="chips" id="favs"></div>
    </div>
    <div class="keys" id="keys"></div>
  </section>
</div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const TAU = Math.PI * 2;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  };
  const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

  // ================= words =================
  const T = {
    es: {
      install: 'Instalar app', stream: 'Modo stream', full: 'Pantalla completa', dropHere: 'Suelta tus canciones aquí',
      prevSong: 'Canción anterior', nextSong: 'Canción siguiente', srcDemo: 'Demo', srcSongs: 'Canciones', srcMic: 'Micrófono', srcPc: 'Audio del PC',
      open: 'Abrir canciones', generate: 'NUEVO VISUAL', prevVis: 'Visual anterior', nextVis: 'Visual siguiente', fav: 'Guardar en favoritos',
      code: 'Código', auto: 'Auto', arFree: 'Libre', intensity: 'Intensidad', speed: 'Velocidad', record: 'Grabar', stop: 'Detener',
      playlist: 'Lista', favs: 'Favoritos', noSongs: 'Abre o suelta canciones', noFavs: 'Toca la estrella para guardar un visual',
      play: 'Reproducir', pause: 'Pausa', idle: 'Sin audio · el visual se mueve solo', demoName: 'Demo · Noche 140', playing: 'Sonando',
      mic: 'Escuchando el micrófono', pc: 'Escuchando el audio del PC', layers: 'capas',
      keys: '<kbd>Espacio</kbd> play · <kbd>G</kbd> nuevo visual · <kbd>←</kbd><kbd>→</kbd> visual anterior/siguiente · <kbd>S</kbd> favorito · <kbd>H</kbd> modo stream · <kbd>F</kbd> pantalla completa · <kbd>R</kbd> grabar',
      streamHint: 'Toca H o Esc para volver', recFrame: 'Grabar descarga un video. En esta vista previa no se pueden descargar archivos: usa la app instalada.',
      recSaved: 'Video guardado', recNo: 'Este navegador no puede grabar video. Usa Chrome o Edge.',
      micNo: 'No se pudo usar el micrófono. En esta vista previa está bloqueado: usa la app instalada y acepta el permiso.',
      pcNo: 'No se pudo capturar el audio del PC. Usa la app instalada en Chrome o Edge.', pcNoAudio: 'Falta el audio: al compartir, marca “Compartir audio del sistema”.',
      badFile: 'Ese archivo no se pudo abrir como audio.', badCode: 'Ese código no existe. Usa letras y números.', faved: 'Guardado en favoritos', unfaved: 'Quitado de favoritos',
      fullNo: 'Pantalla completa no está disponible aquí.', autoOn: 'Auto: cambia de visual cada 32 golpes', added: 'añadidas',
    },
    en: {
      install: 'Install app', stream: 'Stream mode', full: 'Fullscreen', dropHere: 'Drop your songs here',
      prevSong: 'Previous song', nextSong: 'Next song', srcDemo: 'Demo', srcSongs: 'Songs', srcMic: 'Mic', srcPc: 'PC audio',
      open: 'Open songs', generate: 'NEW VISUAL', prevVis: 'Previous visual', nextVis: 'Next visual', fav: 'Save to favorites',
      code: 'Code', auto: 'Auto', arFree: 'Free', intensity: 'Intensity', speed: 'Speed', record: 'Record', stop: 'Stop',
      playlist: 'Playlist', favs: 'Favorites', noSongs: 'Open or drop songs', noFavs: 'Tap the star to save a visual',
      play: 'Play', pause: 'Pause', idle: 'No audio · the visual moves on its own', demoName: 'Demo · Night 140', playing: 'Playing',
      mic: 'Listening to the mic', pc: 'Listening to PC audio', layers: 'layers',
      keys: '<kbd>Space</kbd> play · <kbd>G</kbd> new visual · <kbd>←</kbd><kbd>→</kbd> previous/next visual · <kbd>S</kbd> favorite · <kbd>H</kbd> stream mode · <kbd>F</kbd> fullscreen · <kbd>R</kbd> record',
      streamHint: 'Press H or Esc to go back', recFrame: 'Record downloads a video. This preview cannot download files, so use the installed app.',
      recSaved: 'Video saved', recNo: 'This browser cannot record video. Use Chrome or Edge.',
      micNo: 'Could not use the mic. It is blocked in this preview: use the installed app and allow the permission.',
      pcNo: 'Could not capture PC audio. Use the installed app in Chrome or Edge.', pcNoAudio: 'No audio: when sharing, tick “Share system audio”.',
      badFile: 'That file could not be opened as audio.', badCode: 'That code does not exist. Use letters and numbers.', faved: 'Saved to favorites', unfaved: 'Removed from favorites',
      fullNo: 'Fullscreen is not available here.', autoOn: 'Auto: changes the visual every 32 beats', added: 'added',
    },
  };
  let lang = store.get('cs-lang', 'es') === 'en' ? 'en' : 'es';
  const t = k => (T[lang] && T[lang][k]) || T.es[k] || k;

  const toastEl = $('#toast'); let toastT;
  function toast(msg, ms) { toastEl.textContent = msg; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), ms || 2800); }

  // ================= colors =================
  const rgbCache = {};
  function rgba(hex, a) {
    let c = rgbCache[hex];
    if (!c) { c = rgbCache[hex] = [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)]; }
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a < 0 ? 0 : a > 1 ? 1 : a).toFixed(3) + ')';
  }
  const PALETTES = [
    { n: 'Carmesí', bg: '#07050a', c: ['#e0243a', '#ff7a59', '#f4efe9'] },
    { n: 'Rayo', bg: '#05060f', c: ['#8b5cff', '#7fe3ff', '#f4efe9'] },
    { n: 'Luna', bg: '#08080c', c: ['#f4efe9', '#9aa3c8', '#e0243a'] },
    { n: 'Brasa', bg: '#0a0604', c: ['#ff8a1f', '#ffd166', '#e0243a'] },
    { n: 'Hielo', bg: '#04080d', c: ['#7fe3ff', '#3b82f6', '#f4efe9'] },
    { n: 'Sakura', bg: '#0a0509', c: ['#ff5ca8', '#ffd1e8', '#8b5cff'] },
    { n: 'Tinta', bg: '#0b0b0b', c: ['#f4efe9', '#b8b2c2', '#e0243a'] },
    { n: 'Tormenta', bg: '#06040c', c: ['#8b5cff', '#e0243a', '#f4efe9'] },
    { n: 'Veneno', bg: '#05080a', c: ['#7cff6b', '#8b5cff', '#e8fff0'] },
  ];

  // ================= audio frame data =================
  const A = { bass: 0, mid: 0, high: 0, level: 0, beat: false, beatPulse: 0, beats: 0, spec: new Uint8Array(1024), wave: new Float32Array(2048) };

  // ================= visual families =================
  const FAM = {
    rings(r, P) {
      const n = 3 + (r() * 6 | 0), base = .06 + r() * .12, gap = .035 + r() * .05, wob = .3 + r() * .9, strokes = 2 + (r() * 3 | 0), lobes = 2 + (r() * 7 | 0);
      const band = ['bass', 'mid', 'level'][r() * 3 | 0], spin = (r() - .5) * .8;
      return { draw(F) {
        const { g, M, cx, cy, t } = F; g.lineCap = 'round';
        for (let i = 0; i < n; i++) {
          const k = 1 - i / n, rad = (base + i * gap) * M * (1 + A[band] * .6 * k * F.I), c = P.c[i % 3];
          for (let s = 0; s < strokes; s++) {
            const st = t * spin * (1 + i * .2) + s * 1.3, ph = s * 1.7 + i;
            g.beginPath();
            for (let j = 0; j <= 72; j++) {
              const a = j / 72 * TAU, rr = rad * (1 + Math.sin(a * lobes + st * 2 + ph) * .02 * wob * (1 + A.high * 3 * F.I));
              const x = cx + Math.cos(a + st) * rr, y = cy + Math.sin(a + st) * rr; j ? g.lineTo(x, y) : g.moveTo(x, y);
            }
            g.strokeStyle = rgba(c, .25 + .5 * k); g.lineWidth = M * (.002 + .004 * k * (1 + A.bass)); g.stroke();
          }
        }
      } };
    },

  $('#btn-install').addEventListener('click', async () => { if (!installEvt) return; installEvt.prompt(); try { await installEvt.userChoice; } catch (e) {} installEvt = null; $('#btn-install').hidden = true; });

  // ================= boot =================
  const startCode = (location.hash.length > 1 && seedOf(location.hash.slice(1)) != null) ? location.hash.slice(1) : store.get('cs-last', null);
  setVisual(startCode && seedOf(startCode) != null ? seedOf(startCode) : newSeed());
  markAspect();
  document.querySelectorAll('[data-src]').forEach(b => b.setAttribute('aria-pressed', b.dataset.src === 'demo' ? 'true' : 'false'));
  applyLang();
  layout();

  let lastNow = performance.now(), recTick = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - lastNow) / 1000); lastNow = now;
    analyse(dt, now / 1000);
    render(dt);
    if (source === 'songs' && mediaEl && !seeking) {
      const d = mediaEl.duration; seek.value = isFinite(d) && d > 0 ? Math.round(mediaEl.currentTime / d * 1000) : 0;
      $('#t-cur').textContent = fmt(mediaEl.currentTime); $('#t-dur').textContent = fmt(d);
    } else if (source !== 'songs') { seek.value = 0; $('#t-cur').textContent = '0:00'; $('#t-dur').textContent = source === 'demo' ? '∞' : 'live'; }
    if (rec && now - recTick > 250) { recTick = now; $('#rec-ind').textContent = 'REC ' + fmt((now - recStart) / 1000); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {});
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
