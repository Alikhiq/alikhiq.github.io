<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/kit.css">
<style>
@font-face{font-family:Anton;src:url(fonts/anton.woff2) format('woff2')}
@font-face{font-family:Teko;font-weight:600;src:url(fonts/teko.woff2) format('woff2')}
:root{--a:#2557e8;--b:#f2c14e;--ink:#0b1022;--ivory:#f6f1e7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#000;color:#fff;font-family:"DM Sans",sans-serif}
#S{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.art{position:absolute;inset:0;background-size:cover;background-position:center;transform-origin:50% 45%}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
.grain{position:absolute;inset:-50%;opacity:.10;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.disp{font-family:Anton,Impact,sans-serif;text-transform:uppercase;line-height:.92;letter-spacing:.005em}
.hud{font-family:Teko,"DM Sans",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.stroke{-webkit-text-stroke:3px #000;paint-order:stroke fill;text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 30px rgba(0,0,0,.4)}
/* HUD */
.brand{left:44px;top:44px;display:flex;align-items:center;gap:14px;font-size:34px;line-height:1;padding:10px 18px 6px;background:rgba(0,0,0,.55);border-left:6px solid var(--b)}
.brand b{color:var(--b);font-weight:600}
.stars{right:44px;top:40px;display:flex;gap:6px}
.stars svg{width:58px;height:58px;filter:drop-shadow(0 3px 0 #000)}
.cash{right:48px;top:108px;font-size:58px;color:#8dff6a;text-shadow:0 3px 0 #000,0 0 18px rgba(0,0,0,.6)}
.map{left:44px;bottom:44px;width:190px;height:190px;border-radius:50%;border:5px solid rgba(0,0,0,.8);overflow:hidden;background:#1d2a3f;box-shadow:0 0 0 3px rgba(255,255,255,.25)}
.swipe{right:44px;bottom:60px;font-size:36px;padding:8px 18px 4px;background:rgba(0,0,0,.6);color:#fff}
.swipe b{color:var(--b)}
.tag{font-size:30px;color:var(--b);letter-spacing:.14em}
/* card */
.panel{left:0;right:0;top:520px;bottom:0;background:linear-gradient(180deg,rgba(11,16,34,.0) 0,var(--ink) 80px);padding:66px 64px 0}
.stat{display:grid;grid-template-columns:340px 1fr 150px;align-items:center;gap:22px;margin-top:12px;font-size:40px}
.bar{height:22px;background:rgba(255,255,255,.12);transform:skewX(-14deg);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.ability{margin-top:26px;border:3px solid var(--b);padding:20px 26px 16px;background:rgba(255,255,255,.04)}
/* bubble / subs */
.sub{left:60px;right:60px;bottom:90px;text-align:center;font-size:48px;line-height:1.18;font-weight:500}
.sub span{background:rgba(0,0,0,.7);padding:6px 16px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sub b{color:var(--b);font-weight:700}
/* phone */
.phone{left:50%;top:150px;width:520px;height:1080px;margin-left:-260px;border-radius:70px;background:#0a0a0a;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 0 4px #333,inset 0 0 0 2px #444}
.screen{width:100%;height:100%;border-radius:52px;overflow:hidden;background:#fff;position:relative}
.msgs{position:absolute;inset:0;background:#0d0d10;padding:120px 26px 0;display:flex;flex-direction:column;gap:18px;font-size:30px;line-height:1.25}
.msg{max-width:80%;padding:16px 22px;border-radius:30px;background:#2a2a30}
.msg.me{align-self:flex-end;background:var(--a)}
.chk{display:inline-block}
</style></head>
<body><div id="S"></div>
<script>
const $=s=>document.querySelector(s);
const STAR=f=>`<svg viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z" fill="${f?'var(--b)':'rgba(0,0,0,.45)'}" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const MAP=`<svg viewBox="0 0 190 190" width="190" height="190"><rect width="190" height="190" fill="#24364f"/><path d="M-10 120 C40 100 70 140 120 110 S170 70 200 80" stroke="#3b7fb8" stroke-width="16" fill="none"/>
<g stroke="#8c99ab" stroke-width="6" fill="none"><path d="M0 40H190M0 150H190M40 0V190M95 0V190M150 0V190M0 0L190 190"/></g>
<g fill="#33475f"><rect x="50" y="50" width="35" height="30"/><rect x="105" y="48" width="36" height="34"/><rect x="50" y="160" width="35" height="25"/><rect x="160" y="100" width="30" height="40"/></g>
<path d="M95 80 L106 108 L95 102 L84 108Z" fill="#fff" stroke="#000" stroke-width="2"/><circle cx="150" cy="40" r="9" fill="var(--b)" stroke="#000" stroke-width="3"/></svg>`;
let C, SL, anim={};
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
function hud(stars=0,cash=true){return `<div class="abs brand hud"><span>614</span><b>·</b><span>OPEN CITY</span></div>
 <div class="abs stars" id="stars">${[0,1,2,3,4].map(i=>STAR(i<stars)).join('')}</div>
 ${cash&&C.cash?`<div class="abs cash hud" id="cash">${C.cash}</div>`:''}`}
const SLIDES={
 hero:()=>`<div class="art" id="art" style="background-image:url(art/${C.id}_full.jpg)"></div><div class="vig"></div>
  <div class="abs" style="left:0;right:0;bottom:0;height:640px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.85))"></div>
  ${hud(C.heroStars)}
  <div class="abs" id="name" style="left:60px;right:60px;bottom:400px"><div class="hud tag" style="font-size:38px">${C.cls}</div></div>
  <div class="abs disp stroke" id="hook" style="left:56px;right:56px;bottom:150px;font-size:${C.hookSize||112}px">${C.hook}</div>
  <div class="abs swipe hud">SWIPE <b>→</b></div>`,
 card:()=>`<div class="art" style="bottom:auto;height:600px;background-image:url(art/${C.id}_band.jpg);background-position:${C.bandPos||'center'}"></div>
  <div class="abs brand hud"><span>614</span><b>·</b><span>OPEN CITY</span></div>
  <div class="abs panel">
   <div class="hud tag">${C.cardLabel||'CHARACTER PROFILE'} · 📍 ${C.loc}</div>
   <div class="disp" style="font-size:${C.nameSize||104}px;margin-top:4px">${C.name}</div>
   <div class="hud" style="font-size:40px;color:#c9d2e6;margin-top:6px">${C.cardCls||C.cls}</div>
   <div style="margin-top:14px">${C.stats.map(([k,v,s])=>`<div class="stat hud"><span>${k}</span><div class="bar"><i style="width:${Math.min(v,100)}%"></i></div><span style="text-align:right;color:var(--b)">${s??v}</span></div>`).join('')}</div>
   <div class="ability"><div class="hud tag">${C.abilityLabel||'SPECIAL ABILITY'}</div><div style="font-size:38px;font-weight:700;margin-top:6px">${C.ability[0]}</div><div style="font-size:30px;color:#c9d2e6;margin-top:4px">${C.ability[1]}</div></div>
   
  </div>`,
 wanted:()=>`<div class="art" id="art" style="background-image:url(art/${C.id}_full.jpg);filter:brightness(.42) saturate(1.2)"></div><div class="vig"></div>
  <div class="abs brand hud"><span>614</span><b>·</b><span>OPEN CITY</span></div>
  <div class="abs hud tag" style="left:0;right:0;top:380px;text-align:center;font-size:46px;letter-spacing:.3em">WANTED LEVEL</div>
  <div class="abs" id="bigstars" style="left:0;right:0;top:450px;display:flex;justify-content:center;gap:14px">${[0,1,2,3,4].map(()=>STAR(1).replace('<svg','<svg style="width:170px;height:170px;filter:drop-shadow(0 6px 0 #000) drop-shadow(0 0 30px rgba(255,200,80,.45))"')).join('')}</div>
  <div class="abs disp stroke" style="left:40px;right:40px;top:690px;text-align:center;font-size:${C.wantedSize||128}px">${C.wanted[0]}</div>
  <div class="abs" style="left:80px;right:80px;top:${C.wantedSubTop||1010}px;text-align:center;font-size:40px;line-height:1.3;color:#e8ecf6">${C.wanted[1]}</div>`,
 talk:()=>`<div class="art" id="art" style="background-image:url(art/${C.id}_full.jpg)"></div><div class="vig"></div>
  ${hud(C.heroStars)}
  <div class="abs sub" id="sub"><span><b>${C.talk[0]}:</b> ${C.talk[1]}</span></div>`,
 phone:()=>`<div class="art" style="background-image:url(art/${C.id}_full.jpg);filter:blur(18px) brightness(.45);transform:scale(1.1)"></div>
  <div class="abs brand hud"><span>614</span><b>·</b><span>OPEN CITY</span></div>
  <div class="abs hud tag" style="right:48px;top:50px;font-size:36px">${C.phoneLabel}</div>
  <div class="abs phone"><div class="screen">${C.phone}</div></div>
  <div class="abs" style="left:60px;right:60px;bottom:40px;text-align:center;font-size:36px;color:#e8ecf6">${C.phoneCap}</div>`,
 done:()=>`<div class="art" id="art" style="background-image:url(art/${C.id}_full.jpg);filter:grayscale(1) brightness(.38) contrast(1.1)"></div><div class="vig"></div>
  <div class="abs disp stroke" id="done" style="left:0;right:0;top:330px;text-align:center;font-size:${C.doneSize||190}px;color:var(--b)">${C.doneTitle||'JOB DONE'}</div>
  <div class="abs hud" id="resp" style="left:0;right:0;top:${330+(C.doneSize||190)*1.02}px;text-align:center;font-size:64px;color:#fff;text-shadow:0 3px 0 #000">${C.doneSub||'+ RESPECT'}</div>
  <div class="abs" style="left:90px;right:90px;top:700px;height:2px;background:linear-gradient(90deg,transparent,var(--b),transparent)"></div>
  <div class="abs" id="cta" style="left:70px;right:70px;top:750px;text-align:center">
   <div style="font-size:44px;line-height:1.3;font-weight:500">${C.cta[0]}</div>
   <div class="disp" style="font-size:78px;margin-top:26px;color:#fff">roundcity.co</div>
   <div style="font-size:38px;margin-top:40px;color:#c9d2e6">${C.cta[1]}</div>
  </div>`,
};
window.setup=(cfg,slide)=>{C=cfg;SL=slide;document.documentElement.style.setProperty('--a',C.a);document.documentElement.style.setProperty('--b',C.b);
 $('#S').innerHTML=SLIDES[slide]()+'<div class="grain" id="grain"></div>';return document.fonts.ready.then(()=>Promise.all([...document.querySelectorAll('img')].map(i=>i.decode&&i.decode().catch(()=>0))))};
// ---- motion (for clips) ----
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>cl((t-a)/(b-a)), oc=x=>1-Math.pow(1-x,3), ob=x=>{const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
window.seek=(t,D)=>{const art=$('#art');if(art)art.style.transform=`scale(${1.02+0.07*t/D})`;
 const g=$('#grain');if(g)g.style.transform=`translate(${(Math.sin(t*91)*40)|0}px,${(Math.cos(t*77)*40)|0}px)`;
 if(SL==='hero'){const n=C.heroStars;document.querySelectorAll('#stars svg').forEach((s,i)=>{const k=seg(t,1.6+i*0.28,1.9+i*0.28);s.querySelector('path').setAttribute('fill',i<n&&k>0?'var(--b)':'rgba(0,0,0,.45)');s.style.transform=`scale(${i<n?1+0.5*Math.sin(Math.PI*k):1})`});
  const h=$('#hook');const k=oc(seg(t,0.35,1.0));h.style.opacity=k;h.style.transform=`translateY(${(1-k)*60}px)`;
  const nm=$('#name');nm.style.opacity=seg(t,0.9,1.3);
  const cash=$('#cash');if(cash){const v=Math.round(C.cashN*oc(seg(t,0.6,3.2)));cash.textContent=(C.cashPre??'$')+String(v).replace(/\B(?=(\d{3})+(?!\d))/g,',')+(C.cashSuf||'')}
  $('#S').style.filter=`grayscale(${seg(t,D-1.6,D-1.2)}) brightness(${1-0.45*seg(t,D-1.6,D-1.2)})`;
  let d=$('#doneX');if(!d){d=el(`<div id="doneX" class="abs disp stroke" style="left:0;right:0;top:470px;text-align:center;font-size:${(C.doneSize||190)*0.9}px;color:var(--b)">${C.doneTitle||'JOB DONE'}<div class="hud" style="font-size:60px;color:#fff;-webkit-text-stroke:0">${C.doneSub||'+ RESPECT'}</div></div>`);document.body.appendChild(d)}
  const q=seg(t,D-1.3,D-0.95);d.style.opacity=q;d.style.transform=`scale(${1.6-0.6*ob(q)})`;}
 if(SL==='wanted'){document.querySelectorAll('#bigstars svg').forEach((s,i)=>{const k=seg(t,0.4+i*0.3,0.7+i*0.3);s.style.opacity=k;s.style.transform=`scale(${k?1+0.4*Math.sin(Math.PI*k)+ (1-k)*0:0.3})`})}
};
</script></body></html>
