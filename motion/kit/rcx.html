<!doctype html><html><head><meta charset="utf-8"><title>Round City offers: data-driven scenes (rcx.html?v=&lt;id&gt;, configs in lib/rcx-videos.js)</title>
<link rel="stylesheet" href="lib/common.css"><link rel="stylesheet" href="lib/rc.css">
<style>
/* Round City palette: lapis + gold. Every price and scope line comes from roundcity.co (see lib/rcx-videos.js). */
.stage{background:radial-gradient(120% 80% at 50% 40%,#1a2a5c 0%,#0d1634 48%,#070b18 100%)}
.sc{position:absolute;inset:0;z-index:5;opacity:0}
.bgv{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;z-index:0}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(6,10,24,.95) 0%,rgba(6,10,24,.75) 30%,rgba(6,10,24,0) 55%)}
.lab{position:absolute;left:0;right:0;text-align:center;font-family:var(--sans);font-weight:500;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:var(--champagne);z-index:3}
.ttl{position:absolute;left:70px;right:70px;text-align:center;font-family:var(--serif);font-size:92px;line-height:1.06;color:var(--ivory);z-index:3}
.big{position:absolute;left:0;right:0;text-align:center;font-family:var(--serif);font-size:250px;line-height:1;z-index:3;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 40px rgba(233,191,149,.22))}
.big.sm{font-size:180px}
.fee{position:absolute;left:0;right:0;text-align:center;font-family:var(--sans);font-size:30px;color:rgba(247,238,226,.7);z-index:3}
.items{position:absolute;left:110px;right:90px;z-index:3;display:grid;gap:30px}
.it{display:flex;gap:26px;align-items:flex-start;font-family:var(--sans);font-size:42px;line-height:1.25;color:var(--ivory)}
.it i{flex:none;width:46px;height:46px;margin-top:2px;border-radius:50%;background:var(--gold-grad);display:grid;place-items:center;font-style:normal;color:#14182e;font-size:28px;font-weight:700}
.it.x{color:rgba(247,238,226,.62);font-size:36px}.it.x i{background:none;border:2px solid rgba(233,191,149,.55);color:var(--champagne)}
.note{position:absolute;left:90px;right:90px;text-align:center;font-family:var(--sans);font-size:31px;line-height:1.45;color:rgba(247,238,226,.72);z-index:3}
.note b{color:var(--champagne);font-weight:500}
.tiers{position:absolute;left:60px;right:60px;z-index:3;display:grid;gap:22px}
.tier{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:34px 40px;border-radius:30px;background:rgba(14,24,56,.72);box-shadow:0 0 0 2px rgba(233,191,149,.35),0 30px 80px -30px rgba(0,0,0,.7)}
.tier .tn{font-family:var(--serif);font-size:54px;line-height:1.08;color:var(--ivory)}
.tier .tw{font-family:var(--sans);font-size:28px;color:rgba(247,238,226,.68);margin-top:8px}
.tier .tp{flex:none;font-family:var(--serif);font-size:74px;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tier .tp.q{font-size:44px}
.steps{position:absolute;left:90px;right:90px;z-index:3;display:grid;gap:56px}
.st{display:flex;gap:34px;align-items:baseline}
.st .n{flex:none;font-family:var(--serif);font-size:110px;line-height:.9;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.st .h{font-family:var(--serif);font-size:56px;line-height:1.1;color:var(--ivory)}
.st .d{font-family:var(--sans);font-size:32px;line-height:1.4;color:rgba(247,238,226,.72);margin-top:10px}
.shot{position:absolute;z-index:2;border-radius:28px;overflow:hidden;box-shadow:0 50px 110px -30px rgba(0,0,0,.85),0 0 0 2px rgba(233,191,149,.5);background:#0d1634}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.rule2{position:absolute;left:50%;width:380px;margin-left:-190px;z-index:3}
#rcend{left:0;right:0;top:470px;z-index:11}
#cta{position:absolute;left:50%;top:1330px;transform:translateX(-50%);z-index:11;padding:28px 80px;border-radius:70px;background:var(--gold-grad);color:#14182e;font-family:var(--sans);font-weight:700;font-size:42px;white-space:nowrap;opacity:0}
#fine{position:absolute;left:0;right:0;top:1470px;z-index:11;text-align:center;font-family:var(--sans);font-size:29px;color:rgba(247,238,226,.72)}
#endbg{z-index:10;background:radial-gradient(120% 80% at 50% 42%,#1a2a5c 0%,#0d1634 50%,#070b18 100%);opacity:0}
#dustFar{z-index:1} #dustNear{z-index:12}
#root{position:absolute;inset:0;transform-origin:50% 45%;will-change:transform,filter}
</style></head><body>
<div class="stage" id="stage">
  <canvas class="dust" id="dustFar"></canvas>
  <div id="root"></div><div class="layer" id="flash" style="z-index:9;background:radial-gradient(80% 60% at 50% 45%,#fff2dc 0%,rgba(255,236,210,0) 70%);opacity:0;mix-blend-mode:screen"></div>
  <div class="layer" id="endbg"></div><div id="rcend"></div><div id="cta"></div><div id="fine"></div>
  <canvas class="dust" id="dustNear"></canvas>
  <div class="vignette"></div><div class="grain" id="grain"></div><div class="black" id="black"></div>
</div>
<script src="lib/common.js"></script><script src="lib/rc.js"></script><script src="lib/rcx-videos.js"></script>
<script>
const ID = new URLSearchParams(location.search).get('v') || 'ft1499';
const CFG = RCX[ID];
const root = $('#root');
const far = new Dust($('#dustFar'), { n: 120, seed: 31, size: [1, 2.4], bokeh: 0.04, speed: 10, depth: 0.4 });
const near = new Dust($('#dustNear'), { n: 26, seed: 12, size: [1.4, 3.2], bokeh: 0.3, speed: 22, depth: 1 });
const mk = (p, cls, html, css) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; if (css) Object.assign(d.style, css); p.appendChild(d); return d; };
const W = (el) => splitWords(el);
const IN = { dy: 24, blur: 8 };

// ---- scene builders: each returns {dur, draw(lt)} and owns one .sc layer ----
const B = {
  hook(s, L) { // one to three lines of big type
    const ws = s.lines.map((ln, i) => W(mk(L, 'ttl', ln, { top: (s.top || 700) + i * (s.gap || 220) + 'px', fontSize: (s.size || 92) + 'px' })));
    const lab = s.label ? W(mk(L, 'lab', s.label, { top: ((s.top || 700) - 110) + 'px' })) : null;
    return { pops: s.lines.map((_, i) => 0.3 + i * (s.step || 0.55)), dur: s.dur || 2.8, draw(t) { if (lab) animWords(lab, t, 0.1, 0.04, 0.7, null, IN); ws.forEach((w, i) => animWords(w, t, 0.25 + i * (s.step || 0.55), 0.07, 0.9, null, IN)); } };
  },
  price(s, L) { // package: label, name, big price, fee line, included items, note
    const lab = W(mk(L, 'lab', s.label, { top: '250px' }));
    const nm = W(mk(L, 'ttl', s.name, { top: '310px', fontSize: '74px' }));
    const big = mk(L, 'big' + (s.price.length > 7 ? ' sm' : ''), s.price, { top: '450px' });
    const fee = W(mk(L, 'fee', s.fee || 'fixed project fee · USD', { top: s.price.length > 7 ? '660px' : '730px' }));
    const ru = mk(L, 'rule rule2', null, { top: '820px' });
    const box = mk(L, 'items', null, { top: '880px' });
    const its = s.items.map((x) => { const r = mk(box, 'it' + (x[0] === '-' ? ' x' : ''), `<i>${x[0] === '-' ? '–' : '✓'}</i><span>${x.replace(/^-/, '')}</span>`); return r; });
    const note = s.note ? W(mk(L, 'note', s.note, { top: (s.noteTop || 1560) + 'px' })) : null;
    const t0 = 1.5, st = s.stagger || 0.5;
    return { hits: [0.55], riser: 0.55, pops: its.map((_, i) => t0 + i * st + 0.08), dur: s.dur || (t0 + its.length * st + 2.6), draw(t) {
      animWords(lab, t, 0.05, 0.04, 0.6, null, IN); animWords(nm, t, 0.2, 0.06, 0.8, null, IN);
      const k = E.outQuart(seg(t, 0.45, 1.25)); setEl(big, { op: k, s: 1.25 - 0.25 * k, blur: (1 - k) * 14 });
      animWords(fee, t, 0.9, 0.03, 0.6, null, IN);
      const r = E.outQuart(seg(t, 1.0, 1.7)); ru.style.transform = `scaleX(${r.toFixed(3)})`; ru.style.opacity = r.toFixed(3);
      its.forEach((el, i) => { const a = E.outCubic(seg(t, t0 + i * st, t0 + i * st + 0.55)); setEl(el, { op: a, x: (1 - a) * -40 }); });
      if (note) animWords(note, t, t0 + its.length * st + 0.2, 0.025, 0.7, null, IN);
    } };
  },
  tiers(s, L) { // stacked tier cards
    const lab = s.label ? W(mk(L, 'lab', s.label, { top: (s.top || 300) - 140 + 'px' })) : null;
    const tt = s.title ? W(mk(L, 'ttl', s.title, { top: (s.top || 300) - 90 + 'px', fontSize: '72px' })) : null;
    const box = mk(L, 'tiers', null, { top: (s.top || 300) + (s.title ? 130 : 0) + 'px' });
    const rows = s.rows.map(([n, w, p]) => mk(box, 'tier', `<div><div class="tn">${n}</div>${w ? `<div class="tw">${w}</div>` : ''}</div><div class="tp${/\$/.test(p) ? '' : ' q'}">${p}</div>`));
    const note = s.note ? W(mk(L, 'note', s.note, { top: (s.noteTop || 1600) + 'px' })) : null;
    const st = s.stagger || 0.7;
    return { pops: rows.map((_, i) => 0.95 + i * st), dur: s.dur || (1.2 + rows.length * st + 2.6), draw(t) {
      if (lab) animWords(lab, t, 0.05, 0.04, 0.6, null, IN); if (tt) animWords(tt, t, 0.2, 0.06, 0.8, null, IN);
      rows.forEach((el, i) => { const a = E.outQuart(seg(t, 0.9 + i * st, 1.6 + i * st)); setEl(el, { op: a, y: (1 - a) * 60, s: 0.96 + 0.04 * a }); });
      if (note) animWords(note, t, 1.2 + rows.length * st, 0.025, 0.7, null, IN);
    } };
  },
  steps(s, L) {
    const lab = W(mk(L, 'lab', s.label, { top: '300px' })); const tt = W(mk(L, 'ttl', s.title, { top: '370px', fontSize: '80px' }));
    const box = mk(L, 'steps', null, { top: (s.top || 700) + 'px' });
    const rows = s.rows.map(([h, d], i) => mk(box, 'st', `<div class="n">0${i + 1}</div><div><div class="h">${h}</div>${d ? `<div class="d">${d}</div>` : ''}</div>`));
    return { pops: rows.map((_, i) => 1.05 + i * 0.9), dur: s.dur || (1.2 + rows.length * 0.9 + 2.4), draw(t) {
      animWords(lab, t, 0.05, 0.04, 0.6, null, IN); animWords(tt, t, 0.2, 0.06, 0.8, null, IN);
      rows.forEach((el, i) => { const a = E.outQuart(seg(t, 1.0 + i * 0.9, 1.7 + i * 0.9)); setEl(el, { op: a, x: (1 - a) * 50 }); });
    } };
  },
  shot(s, L) { // one screenshot card with a slow push, caption below
    const h = s.h || 1120, w = s.w || 700;
    const c = mk(L, 'shot', `<img src="${s.img}">`, { left: (1080 - w) / 2 + 'px', top: (s.top || 220) + 'px', width: w + 'px', height: h + 'px' });
    const lab = W(mk(L, 'lab', s.label, { top: ((s.top || 220) + h + 70) + 'px' }));
    const tt = W(mk(L, 'ttl', s.title, { top: ((s.top || 220) + h + 120) + 'px', fontSize: '66px' }));
    const dur = s.dur || 3.2;
    return { pops: [0.35], dur, draw(t) { const k = E.outQuart(seg(t, 0, 0.8)); setEl(c, { op: k, y: (1 - k) * 80, s: 0.95 + 0.05 * k + 0.02 * seg(t, 0, dur) });
      $('img', c).style.transform = `scale(${(1 + 0.05 * seg(t, 0, dur)).toFixed(4)})`;
      animWords(lab, t, 0.3, 0.04, 0.6, null, IN); animWords(tt, t, 0.45, 0.06, 0.8, null, IN); } };
  },
  bg3d(s, L) { // Blender render frames as the background, with type over the lower third
    const im = document.createElement('img'); im.className = 'bgv'; L.appendChild(im); mk(L, 'shade');
    const lab = s.label ? W(mk(L, 'lab', s.label, { top: (s.top || 1280) + 'px' })) : null;
    const tt = W(mk(L, 'ttl', s.title, { top: (s.top || 1280) + 60 + 'px', fontSize: (s.size || 84) + 'px' }));
    const sub = s.sub ? W(mk(L, 'note', s.sub, { top: (s.subTop || (s.top || 1280) + 300) + 'px', fontSize: '34px' })) : null;
    const N = s.frames, dur = s.dur || N / 30;
    return { hits: [(s.textAt || 0.6) + 0.2], riser: (s.textAt || 0.6) + 0.2, dur, draw(t) { seqFrame(im, `/v3/${s.dir}/${pad(clamp(Math.floor(t * 30) + 1, 1, N), 4)}.jpg`);
      if (lab) animWords(lab, t, s.textAt || 0.6, 0.04, 0.6, null, IN); animWords(tt, t, (s.textAt || 0.6) + 0.15, 0.06, 0.9, null, IN);
      if (sub) animWords(sub, t, (s.textAt || 0.6) + 0.8, 0.03, 0.7, null, IN); } };
  },
  bg3dTiers(s, L) { // Blender frames on top half, tier cards appear in sync below
    const im = document.createElement('img'); im.className = 'bgv'; L.appendChild(im);
    const tt = W(mk(L, 'lab', s.label, { top: '210px' }));
    const box = mk(L, 'tiers', null, { top: '1060px' });
    const rows = s.rows.map(([n, w, p]) => mk(box, 'tier', `<div><div class="tn" style="font-size:46px">${n}</div>${w ? `<div class="tw">${w}</div>` : ''}</div><div class="tp${/\$/.test(p) ? '' : ' q'}" style="font-size:64px">${p}</div>`));
    const note = s.note ? W(mk(L, 'note', s.note, { top: '1700px', fontSize: '28px' })) : null;
    const N = s.frames, dur = s.dur || N / 30;
    return { pops: s.at.map((a) => a + 0.12), dur, draw(t) { seqFrame(im, `/v3/${s.dir}/${pad(clamp(Math.floor(t * 30) + 1, 1, N), 4)}.jpg`);
      animWords(tt, t, 0.3, 0.04, 0.6, null, IN);
      rows.forEach((el, i) => { const a = E.outQuart(seg(t, s.at[i], s.at[i] + 0.7)); setEl(el, { op: a, y: (1 - a) * 50 }); });
      if (note) animWords(note, t, dur - 2.0, 0.025, 0.7, null, IN); } };
  },
};

// ---- timeline ----
const scenes = CFG.scenes.map((s) => { const L = mk(root, 'sc'); const b = B[s.type](s, L); return { L, ...b }; });
let T = 0; scenes.forEach((s) => { s.a = T; T += s.dur; });
const END = T, ENDDUR = 4.4;
window.__DUR = END + ENDDUR;
// Motion Bro-style: zoom-blur whip on every cut, a shake on every price hit. Events feed the sound mix (lib/sfx2.py).
const CUTS = scenes.slice(1).map((s) => s.a).concat([END]);
const HITS = [].concat(...scenes.map((s) => (s.hits || []).map((h) => s.a + h)));
window.__EVENTS = { cuts: CUTS, hits: HITS, risers: [].concat(...scenes.map((s) => s.riser != null ? [s.a + s.riser] : [])),
  pops: [].concat(...scenes.map((s) => (s.pops || []).map((p) => s.a + p))), end: END, dur: END + ENDDUR };
const rc = RCEnd($('#rcend'), { by: CFG.by || 'Software + automation · Built with Ali', url: CFG.url || 'roundcity.co', scale: 1.25 });
$('#cta').textContent = CFG.cta || 'Talk with Ali'; $('#fine').textContent = CFG.fine || 'Columbus, Ohio · roundcity.co';
const WF = W($('#fine'));
window.__ready = Promise.all([document.fonts.ready]).then(() => true);
window.seek = async (t) => {
  $('#black').style.opacity = (1 - E.inOutSine(seg(t, 0, 0.5))).toFixed(3);
  scenes.forEach((s, i) => { const lt = t - s.a; const vis = lt > -0.3 && lt < s.dur + 0.3;
    const o = (i === 0 ? 1 : E.inOutSine(seg(lt, -0.25, 0.2))) * (1 - E.inOutSine(seg(lt, s.dur - 0.25, s.dur + 0.2)));
    s.L.style.opacity = o.toFixed(3); s.L.style.visibility = vis ? 'visible' : 'hidden'; if (vis) s.draw(Math.max(0, lt)); });
  const e = E.inOutSine(seg(t, END - 0.2, END + 0.4)); $('#endbg').style.opacity = e.toFixed(3);
  const te = t - END; rc.draw(Math.max(0, te), e);
  const c = E.outCubic(seg(te, 2.5, 3.3)); $('#cta').style.opacity = c.toFixed(3); $('#cta').style.transform = `translateX(-50%) translateY(${((1 - c) * 24).toFixed(1)}px) scale(${(0.96 + 0.04 * c).toFixed(3)})`;
  animWords(WF, te, 3.0, 0.04, 0.8, null, { dy: 10, blur: 5 });
  let amt = 0, dir = 1; CUTS.forEach((c) => { const d = t - c; if (Math.abs(d) < 0.32) { const a = 1 - Math.abs(d) / 0.32; if (a > amt) { amt = a; dir = d < 0 ? 1 : -1; } } });
  amt = E.inOutSine(amt);
  let sx = 0, sy = 0; HITS.forEach((h) => { const d = t - h; if (d >= 0 && d < 0.45) { const k = Math.pow(1 - d / 0.45, 2); sx += Math.sin(d * 95) * 14 * k; sy += Math.cos(d * 80) * 10 * k; } });
  const R = $('#root'); R.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${(1 + 0.09 * amt).toFixed(4)}) rotate(${(dir * 1.4 * amt).toFixed(3)}deg)`;
  R.style.filter = amt > 0.01 ? `blur(${(amt * 9).toFixed(2)}px)` : 'none';
  const fl = Math.max(0, ...CUTS.map((c) => 1 - Math.abs(t - c) / 0.18)); $('#flash').style.opacity = (Math.max(0, fl) * 0.32).toFixed(3);
  far.draw(t + 4, 0.75, { dy: -t * 6 }); near.draw(t + 2, 0.45, { dy: -t * 20 });
  grainJitter($('#grain'), t);
  await flushDecodes();
};
</script></body></html>
