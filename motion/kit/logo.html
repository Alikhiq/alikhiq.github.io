<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<script type="module">
import * as THREE from 'three';

const W = innerWidth, H = innerHeight;

const crystal = new THREE.MeshPhysicalMaterial({ color: 0xe2bf96, metalness: 0.5, roughness: 0.1, specularIntensity: 1, specularColor: new THREE.Color(0xffe9cc),

const goldSmall = new THREE.MeshPhysicalMaterial({ color: 0xe6bd88, metalness: 1, roughness: 0.26, envMapIntensity: 1.2, transparent: true });

  mesh.position.set((cx - VB_W / 2) * k, -(cy - VB_H / 2) * k, 0);

});
letters.sort((a, b) => a.userData.cx - b.userData.cx); glyphs.sort((a, b) => a.userData.cx - b.userData.cx);
const setOpacity = (mesh, o) => mesh.material.forEach((m) => { m.opacity = o; });
const radialTex = () => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,230,196,1)'); g.addColorStop(0.25, 'rgba(240,196,140,.45)'); g.addColorStop(0.6, 'rgba(200,140,90,.10)'); g.addColorStop(1, 'rgba(200,140,90,0)');

const starTex = () => { const c = document.createElement('canvas'); c.width = c.height = 256; const x = c.getContext('2d');
  const core = x.createRadialGradient(128, 128, 0, 128, 128, 128); core.addColorStop(0, 'rgba(255,250,240,1)'); core.addColorStop(0.08, 'rgba(255,236,206,.85)'); core.addColorStop(0.3, 'rgba(240,190,130,.12)'); core.addColorStop(1, 'rgba(240,190,130,0)');

  const ray = (ang, len, w) => { x.save(); x.translate(128, 128); x.rotate(ang); const g = x.createLinearGradient(-len, 0, len, 0);
    g.addColorStop(0, 'rgba(255,225,180,0)'); g.addColorStop(0.5, 'rgba(255,245,230,.95)'); g.addColorStop(1, 'rgba(255,225,180,0)'); x.fillStyle = g; x.beginPath(); x.ellipse(0, 0, len, w, 0, 0, Math.PI * 2); x.fill(); x.restore(); };
  ray(0, 126, 2.6); ray(Math.PI / 2, 110, 2.4); ray(Math.PI / 4, 46, 1.4); ray(-Math.PI / 4, 46, 1.4);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: radialTex(), color: 0xe9b98a, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
halo.scale.set(1.5, 0.95, 1); halo.position.set(0, 0.02, -0.25); halo.renderOrder = -1; inner.add(halo);
const sTex = starTex();
const mkStar = () => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: sTex, transparent: true, opacity: 0, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending })); s.renderOrder = 10; inner.add(s); return s; };
const births = letters.map(() => mkStar()); const glintA = mkStar(), glintB = mkStar();
const swooshTip = new THREE.Vector3((1085 - VB_W / 2) * k, -(150 - VB_H / 2) * k, 0.03);
const uTip = new THREE.Vector3((2930 - VB_W / 2) * k, -(262 - VB_H / 2) * k, 0.03);
const N = 260; const pos = new Float32Array(N * 3), seed = new Float32Array(N * 2);
for (let i = 0; i < N; i++) { pos[i * 3] = (Math.random() - 0.5) * 2.1; pos[i * 3 + 1] = (Math.random() - 0.5) * 1.5; pos[i * 3 + 2] = (Math.random() - 0.5) * 0.9 + 0.05; seed[i * 2] = Math.random(); seed[i * 2 + 1] = Math.random(); }
const dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); dustGeo.setAttribute('seed', new THREE.BufferAttribute(seed, 2));
const dustMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
  uniforms: { uT: { value: 0 }, uA: { value: 0 }, uPx: { value: 1 } },
  vertexShader: `attribute vec2 seed; uniform float uT; uniform float uPx; varying float vTw;
    void main(){ vec3 p = position; p.y += mod(uT * (0.018 + seed.x * 0.03) + seed.y, 1.0) * 0.5 - 0.25; p.x += sin(uT * 0.4 + seed.y * 12.0) * 0.025;
      vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
      vTw = 0.35 + 0.65 * pow(0.5 + 0.5 * sin(uT * (1.2 + seed.x * 2.6) + seed.y * 40.0), 3.0);
      gl_PointSize = uPx * (1.2 + seed.x * 2.8) * (10.0 / -mv.z); }`,
  fragmentShader: `uniform float uA; varying float vTw; void main(){ vec2 d = gl_PointCoord - 0.5; float r = length(d); float a = smoothstep(0.5, 0.0, r); a *= a;
      gl_FragColor = vec4(vec3(1.0, 0.86, 0.66) * a * vTw * uA, a * vTw * uA * 0.6); }` });
inner.add(new THREE.Points(dustGeo, dustMat));
const ppu = H / (2 * CAM_Z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
const baseScale = (W * 0.8) / ppu;
dustMat.uniforms.uPx.value = 1.6 * baseScale;
const ease = { outCubic: (t) => 1 - Math.pow(1 - t, 3), outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),

// cinematic timeline (slower than the site intro)
const S = { letters: 0.25, stagger: 0.24, dur: 1.9, tagline: 1.75, sweeps: [[2.55, 3.85], [6.4, 7.6], [10.2, 11.4]], glints: [3.45, 7.3, 11.1], dustIn: 1.4 };

  letters.forEach((m, i) => {
    const a = S.letters + i * S.stagger; const p = seg(t, a, a + S.dur);
    const e = ease.outExpo(p), eb = ease.outBack(Math.min(1, p * 1.05));

    m.position.z = m.userData.home.z - (1 - e) * 0.55; m.position.y = m.userData.home.y - (1 - e) * 0.05;
    setOpacity(m, Math.min(1, p * 4.5)); m.visible = p > 0;
    const st = births[i]; const bt = seg(t, a + 0.02, a + 0.9);

    const sc = 0.15 * Math.sin(bt * Math.PI) + 0.03; st.scale.set(sc, sc, 1);
    st.position.set(m.userData.home.x, m.userData.home.y + 0.06, 0.12); st.material.rotation = bt * 0.9;
  });
  glyphs.forEach((m, i) => { const a = S.tagline + i * 0.06; const p = ease.outCubic(seg(t, a, a + 1.3));
    m.position.x = m.userData.home.x * (1 + (1 - p) * 0.22); m.position.y = m.userData.home.y - (1 - p) * 0.012; setOpacity(m, p); m.visible = p > 0; });

  const settle = ease.outCubic(seg(t, 0, 3.2));

letters.concat(glyphs).forEach((m) => { m.visible = true; }); renderer.compile(scene, camera);
