<!doctype html><html><head><meta charset="utf-8"><title>Round City: Devices</title>
<link rel="stylesheet" href="lib/common.css">
<link rel="stylesheet" href="lib/rc.css">
<style>
/* sizes are set from JS: ?o=v (1080x1920, default) or ?o=l (1920x1080) */
html,body{width:var(--W);height:var(--H)}
.stage{background:radial-gradient(90% 60% at 50% 46%,#33263a 0%,#241b28 45%,#140e16 100%)}
#floor{position:absolute;left:-10%;right:-10%;height:60%;background:radial-gradient(60% 40% at 50% 0%,rgba(233,191,149,.07),rgba(0,0,0,0) 70%),linear-gradient(180deg,rgba(10,6,12,0),rgba(10,6,12,.55))}
#sweep{z-index:30;mix-blend-mode:screen;background:linear-gradient(105deg,rgba(255,226,190,0) 42%,rgba(255,226,190,.10) 50%,rgba(255,226,190,0) 58%);background-size:300% 100%}
.dev{position:absolute;left:0;top:0;transform-origin:50% 50%;will-change:transform,filter}
.devin{position:relative}
.refl{position:absolute;left:0;top:100%;transform:scaleY(-1);transform-origin:50% 50%;opacity:.13;
  -webkit-mask-image:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,0) 34%);mask-image:linear-gradient(0deg,rgba(0,0,0,.9),rgba(0,0,0,0) 34%)}
.shadow{position:absolute;left:50%;border-radius:50%;background:radial-gradient(closest-side,rgba(4,2,5,.75),rgba(4,2,5,0))}
.screen{position:absolute;overflow:hidden;background:#140e16}
.screen img{position:absolute;inset:0;width:100%;height:100%;display:block}
.glare{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(118deg,rgba(255,255,255,0) 30%,rgba(255,246,232,.09) 44%,rgba(255,255,255,.02) 52%,rgba(255,255,255,0) 60%);background-size:260% 100%}
/* laptop: 1440x900 screen shown at 960x600 */
.lap{width:1120px;height:676px}
.lap .lid{position:absolute;left:62px;top:0;width:996px;height:648px;border-radius:22px 22px 6px 6px;
  background:linear-gradient(180deg,#2b2a2f,#1b1a1e);box-shadow:inset 0 0 0 1.5px #4a4750,inset 0 0 0 3px #0c0b0e,0 0 0 1px rgba(0,0,0,.6)}
.lap .screen{left:18px;top:20px;width:960px;height:600px;border-radius:4px}
.lap .cam{position:absolute;left:50%;top:8px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#0a0a0c;box-shadow:inset 0 0 0 1px #3a3840}
.lap .hinge{position:absolute;left:62px;top:646px;width:996px;height:6px;background:linear-gradient(180deg,#0e0d10,#2c2a30)}
.lap .base{position:absolute;left:0;top:650px;width:1120px;height:22px;border-radius:2px 2px 14px 14px/2px 2px 12px 12px;
  background:linear-gradient(180deg,#c9c3c9 0%,#8f8a92 18%,#5a5660 55%,#2c2a30 100%);box-shadow:0 2px 0 #0b0a0c}
.lap .notch{position:absolute;left:50%;top:650px;width:150px;height:8px;margin-left:-75px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,#77727a,#5b5760)}
/* phone: 390x844 screen shown at 360x779 */
.ph{width:392px;height:811px}
.ph .body{position:absolute;inset:0;border-radius:62px;background:linear-gradient(135deg,#8d8790 0%,#3b3840 22%,#22202a 50%,#4a4650 78%,#9b959e 100%);
  box-shadow:0 0 0 1px rgba(0,0,0,.55)}
.ph .bez{position:absolute;inset:4px;border-radius:58px;background:#060507}
.ph .screen{left:16px;top:16px;width:360px;height:779px;border-radius:46px}
.ph .island{position:absolute;left:50%;top:27px;width:108px;height:32px;margin-left:-54px;border-radius:20px;background:#000;z-index:3}
.ph .btn{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3740,#77727a)}
/* captions */
.cap{position:absolute;z-index:40;text-align:center}
.cap .label{font-size:23px;margin-bottom:18px}
.cap .line{font-family:var(--serif);font-size:62px;line-height:1.12;color:var(--ivory)}
.l .cap{text-align:left}
.l .cap .line{font-size:58px}
#end{z-index:50}
</style></head><body>
<div class="stage" id="stage">
  <canvas class="dust" id="dustFar"></canvas>
  <div id="floor"></div>
  <div class="layer" id="world"></div>
  <div class="layer" id="sweep"></div>
  <div class="cap" id="c1"><div class="label">Case study</div><div class="line">Susu Ink <em>&amp; Glow</em></div></div>
  <div class="cap" id="c2"><div class="label">On the phone</div><div class="line">A portrait that <em>tells the story</em></div></div>
  <div class="cap" id="c3"><div class="label">On the desktop</div><div class="line">Every chapter, <em>edge to edge</em></div></div>
  <div class="cap" id="c4"><div class="label">Prices to booking</div><div class="line">One build, <em>every screen</em></div></div>
  <div id="end"></div>
  <canvas class="dust" id="dustNear"></canvas>
  <div class="vignette"></div>
  <div class="grain" id="grain"></div>
  <div class="black" id="black"></div>
</div>
<script src="lib/common.js"></script>
<script src="lib/rc.js"></script>
<script>
const O = new URLSearchParams(location.search).get('o') === 'l' ? 'l' : 'v';
const SW = O === 'l' ? 1920 : 1080, SH = O === 'l' ? 1080 : 1920;
document.documentElement.style.setProperty('--W', SW + 'px'); document.documentElement.style.setProperty('--H', SH + 'px');
document.body.classList.add(O);
const NCAP = 690; // captured frames (0-23 s)
const frameUrl = (kind, t) => `/devices/${kind}/${pad(clamp(Math.round(t * 30), 0, NCAP - 1))}.jpg`;

function laptop() {
  const d = document.createElement('div'); d.className = 'dev';
  const mk = () => { const w = document.createElement('div'); w.className = 'devin lap';
    w.innerHTML = '<div class="lid"><div class="cam"></div><div class="screen"><img><div class="glare"></div></div></div><div class="hinge"></div><div class="base"></div><div class="notch"></div>'; return w; };
  const a = mk(), b = mk(); b.classList.add('refl');
  const sh = document.createElement('div'); sh.className = 'shadow'; Object.assign(sh.style, { width: '1300px', height: '60px', marginLeft: '-650px', top: '646px' });
  d.append(sh, a); a.append(b); return { el: d, imgs: [...d.querySelectorAll('img')], glares: [...d.querySelectorAll('.glare')], w: 1120, h: 676 };
}
function phone() {
  const d = document.createElement('div'); d.className = 'dev';
  const mk = () => { const w = document.createElement('div'); w.className = 'devin ph';
    w.innerHTML = '<div class="body"></div><div class="bez"></div><div class="screen"><img><div class="glare"></div></div><div class="island"></div>' +
      '<i class="btn" style="left:-3px;top:150px;height:34px"></i><i class="btn" style="left:-3px;top:210px;height:64px"></i><i class="btn" style="left:-3px;top:290px;height:64px"></i><i class="btn" style="right:-3px;top:230px;height:100px"></i>';
    return w; };
  const a = mk(), b = mk(); b.classList.add('refl');
  const sh = document.createElement('div'); sh.className = 'shadow'; Object.assign(sh.style, { width: '520px', height: '50px', marginLeft: '-260px', top: '786px' });
  d.append(sh, a); a.append(b); return { el: d, imgs: [...d.querySelectorAll('img')], glares: [...d.querySelectorAll('.glare')], w: 392, h: 811 };
}
const world = $('#world');
const L = laptop(), P = phone();
world.append(L.el, P.el);

// camera keys per orientation: [t, {x, y, s, ry, blur, op, z}] for each device (x,y = centre in stage px)
const KV = {
  lap: [[0, { x: 540, y: 860, s: 0.74, ry: 0, blur: 6, op: 0 }], [1.2, { x: 540, y: 840, s: 0.78, ry: 0, blur: 0, op: 1 }], [3.9, { x: 540, y: 820, s: 0.84, ry: 0, blur: 0, op: 1 }],
    [5.0, { x: 330, y: 760, s: 1.0, ry: 8, blur: 16, op: 0.45 }], [9.0, { x: 300, y: 740, s: 1.06, ry: 8, blur: 18, op: 0.4 }],
    [10.2, { x: 720, y: 930, s: 1.5, ry: -12, blur: 0, op: 1 }], [13.9, { x: 660, y: 930, s: 1.62, ry: -9, blur: 0, op: 1 }],
    [15.0, { x: 470, y: 820, s: 0.8, ry: 12, blur: 0, op: 1 }], [19.4, { x: 500, y: 800, s: 0.86, ry: 9, blur: 0, op: 1 }],
    [21.2, { x: 540, y: 1200, s: 0.6, ry: 0, blur: 14, op: 0 }]],
  ph: [[0, { x: 820, y: 1290, s: 0.86, ry: 0, blur: 6, op: 0 }], [1.5, { x: 810, y: 1250, s: 0.92, ry: 0, blur: 0, op: 1 }], [3.9, { x: 800, y: 1230, s: 0.96, ry: 0, blur: 0, op: 1 }],
    [5.0, { x: 540, y: 980, s: 2.02, ry: -4, blur: 0, op: 1 }], [9.0, { x: 540, y: 960, s: 2.1, ry: -2, blur: 0, op: 1 }],
    [10.2, { x: -120, y: 1300, s: 1.3, ry: 10, blur: 16, op: 0.5 }], [13.9, { x: -100, y: 1300, s: 1.3, ry: 10, blur: 16, op: 0.5 }],
    [15.0, { x: 800, y: 1240, s: 1.0, ry: -10, blur: 0, op: 1 }], [19.4, { x: 780, y: 1220, s: 1.04, ry: -7, blur: 0, op: 1 }],
    [21.2, { x: 680, y: 1500, s: 0.7, ry: 0, blur: 14, op: 0 }]],
};
const KL = {
  lap: [[0, { x: 820, y: 620, s: 0.84, ry: 0, blur: 6, op: 0 }], [1.2, { x: 810, y: 600, s: 0.88, ry: 0, blur: 0, op: 1 }], [3.9, { x: 800, y: 580, s: 0.94, ry: 0, blur: 0, op: 1 }],
    [5.0, { x: 520, y: 520, s: 0.98, ry: 10, blur: 14, op: 0.45 }], [9.0, { x: 500, y: 510, s: 1.02, ry: 10, blur: 16, op: 0.4 }],
    [10.2, { x: 1080, y: 600, s: 1.6, ry: -10, blur: 0, op: 1 }], [13.9, { x: 1020, y: 600, s: 1.7, ry: -8, blur: 0, op: 1 }],
    [15.0, { x: 780, y: 530, s: 0.9, ry: 10, blur: 0, op: 1 }], [19.4, { x: 800, y: 520, s: 0.95, ry: 8, blur: 0, op: 1 }],
    [21.2, { x: 960, y: 800, s: 0.66, ry: 0, blur: 14, op: 0 }]],
  ph: [[0, { x: 1470, y: 690, s: 0.8, ry: 0, blur: 6, op: 0 }], [1.5, { x: 1460, y: 660, s: 0.84, ry: 0, blur: 0, op: 1 }], [3.9, { x: 1450, y: 640, s: 0.88, ry: 0, blur: 0, op: 1 }],
    [5.0, { x: 1300, y: 560, s: 1.22, ry: -6, blur: 0, op: 1 }], [9.0, { x: 1300, y: 550, s: 1.28, ry: -4, blur: 0, op: 1 }],
    [10.2, { x: 2060, y: 640, s: 1.1, ry: -12, blur: 16, op: 0.5 }], [13.9, { x: 2040, y: 640, s: 1.1, ry: -12, blur: 16, op: 0.5 }],
    [15.0, { x: 1480, y: 620, s: 0.9, ry: -10, blur: 0, op: 1 }], [19.4, { x: 1460, y: 610, s: 0.94, ry: -7, blur: 0, op: 1 }],
    [21.2, { x: 1300, y: 860, s: 0.62, ry: 0, blur: 14, op: 0 }]],
};
const K = O === 'l' ? KL : KV;
const sample = (keys, t) => {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, a] = keys[i], [t1, b] = keys[i + 1];
    if (t <= t1) { const k = E.inOut(seg(t, t0, t1)); const o = {}; for (const key in a) o[key] = lerp(a[key], b[key], k); return o; }
  }
  return keys[keys.length - 1][1];
};
const place = (D, v) => {
  D.el.style.transform = `translate3d(${(v.x - D.w / 2).toFixed(1)}px,${(v.y - D.h / 2).toFixed(1)}px,0) perspective(2600px) scale(${v.s.toFixed(4)}) rotateY(${v.ry.toFixed(2)}deg)`;
  D.el.style.filter = v.blur > 0.1 ? `blur(${v.blur.toFixed(1)}px)` : 'none';
  D.el.style.opacity = clamp(v.op).toFixed(3);
  D.el.style.zIndex = v.blur > 4 ? 1 : 5;
};

// captions: positions per orientation
const capPos = O === 'l'
  ? { c1: [140, 80, 'left'], c2: [140, 420, 'left'], c3: [140, 90, 'left'], c4: [140, 80, 'left'] }
  : { c1: [0, 300, 'center'], c2: [0, 290, 'center'], c3: [0, 300, 'center'], c4: [0, 300, 'center'] };
const caps = {};
for (const id of ['c1', 'c2', 'c3', 'c4']) {
  const el = $('#' + id), [x, y] = capPos[id];
  if (O === 'l') { el.style.left = x + 'px'; el.style.top = y + 'px'; } else { el.style.left = '0'; el.style.right = '0'; el.style.top = y + 'px'; }
  caps[id] = { lab: splitWords($('.label', el)), line: splitWords($('.line', el)) };
}
// c2 sits on top of the phone close-up in the vertical cut: give it a soft scrim
// the phone fills the vertical frame in this shot, so its own chapter text carries it: no caption there
if (O === 'v') $('#c2').style.display = 'none';
const capWin = { c1: [0.9, 3.9], c2: [5.6, 8.7], c3: [10.8, 13.6], c4: [15.6, 19.0] };

const endEl = $('#end');
if (O === 'l') Object.assign(endEl.style, { left: '0', right: '0', top: '210px' }); else Object.assign(endEl.style, { left: '0', right: '0', top: '600px' });
endEl.style.setProperty('--k', O === 'l' ? '0.9' : '1.05');
const RC = RCEnd(endEl, { scale: O === 'l' ? 0.9 : 1.05 });

const far = new Dust($('#dustFar'), { n: 110, seed: 5, size: [1, 2.4], bokeh: 0.05, speed: 10, depth: 0.4 });
const near = new Dust($('#dustNear'), { n: 26, seed: 12, size: [1.4, 3.2], bokeh: 0.3, speed: 22, depth: 1 });
window.__ready = Promise.all([document.fonts.ready, preload([frameUrl('desk', 0), frameUrl('mob', 0)])]).then(() => true);

window.seek = async (t) => {
  $('#black').style.opacity = (1 - E.inOutSine(seg(t, 0.0, 1.2))).toFixed(3);
  // floor line follows the wide shots
  $('#floor').style.top = (O === 'l' ? 896 : 1104) + 'px';
  $('#floor').style.opacity = (1 - 0.7 * (env(t, 4.4, 5.2, 9.0, 10.0) + env(t, 9.6, 10.4, 14.0, 15.0)) - seg(t, 19.6, 21)).toFixed(3);
  const vl = sample(K.lap, t), vp = sample(K.ph, t);
  place(L, vl); place(P, vp);
  const ct = Math.min(t, 22.9);
  L.imgs.forEach((i) => seqFrame(i, frameUrl('desk', ct)));
  P.imgs.forEach((i) => seqFrame(i, frameUrl('mob', ct)));
  const gp = (100 - ((t * 9) % 200)) + '% 0';
  [...L.glares, ...P.glares].forEach((g) => (g.style.backgroundPosition = gp));
  // light sweeps across the whole frame at the shot changes
  const sw = [1.2, 5.0, 10.2, 15.0].map((a) => seg(t, a - 0.2, a + 1.6)).find((x) => x > 0 && x < 1);
  $('#sweep').style.opacity = sw ? Math.sin(Math.PI * sw).toFixed(3) : 0;
  $('#sweep').style.backgroundPosition = sw ? `${(130 - sw * 160).toFixed(1)}% 0` : '0 0';
  for (const id in capWin) {
    const [a, b] = capWin[id];
    animWords(caps[id].lab, t, a, 0.05, 0.9, [b, 0.6, 0.02], { dy: 12, blur: 6 });
    animWords(caps[id].line, t, a + 0.15, 0.08, 1.1, [b + 0.05, 0.7, 0.03]);
  }
  RC.draw(Math.max(0, t - 20.2), t > 20.1 ? 1 : 0);
  const dA = E.inOutSine(seg(t, 0.2, 2));
  far.draw(t + 3, dA * 0.7, { dy: -t * 5 });
  near.draw(t, dA * 0.45 * (1 - 0.5 * env(t, 4.5, 5.2, 9, 10)), { dy: -t * 16 });
  grainJitter($('#grain'), t);
  await flushDecodes();
};
</script></body></html>
