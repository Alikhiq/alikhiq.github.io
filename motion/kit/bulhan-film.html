<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>The Book of Wonders: 90-second film</title>
<!-- 90 s, 1280x720, cut to the narration (work/vo.mp3, starts at 3 s). window.seek(t) draws second t. PAGE=bulhan-film.html node lib/bulhancap.js <out> 24 0 90 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Marcellus&display=block">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#000}
.shot{position:absolute;inset:0;opacity:0;overflow:hidden;background:#000}
.blur{position:absolute;inset:-12%;background-repeat:no-repeat;background-size:cover;background-position:50% 50%;filter:blur(38px) brightness(.42) saturate(1.2)}
.pt{position:absolute;left:50%;top:50%;background-repeat:no-repeat;will-change:transform;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 9%,#000 91%,transparent 100%)}
.shot img{position:absolute;inset:0;width:1280px;height:720px;object-fit:cover}
#grade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.62) 100%),linear-gradient(transparent 52%,rgba(0,0,0,.62) 92%)}
#grain{position:absolute;inset:0;width:1280px;height:720px;opacity:.09;mix-blend-mode:overlay;image-rendering:pixelated}
.bar{position:absolute;left:0;right:0;height:58px;background:#000}
#name{position:absolute;left:0;right:0;bottom:92px;text-align:center;color:#f4e8c8;text-shadow:0 3px 26px #000,0 0 4px #000}
#name::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:260px;margin:-130px 0 0 -450px;background:radial-gradient(ellipse closest-side,rgba(0,0,0,.72),rgba(0,0,0,.45) 55%,transparent);z-index:-1}
#nar{font-family:"Amiri",serif;direction:rtl;font-size:72px;line-height:1.25}
#nen{font-family:"Marcellus",serif;font-size:21px;letter-spacing:.34em;text-transform:uppercase;color:#fff;margin-top:2px}
#tag{position:absolute;right:26px;bottom:20px;font:12px/1 "Marcellus",serif;letter-spacing:.2em;text-transform:uppercase;color:#fff;opacity:0}
#fade{position:absolute;inset:0;background:#000}
</style></head><body><div id="stage">
<div id="shots"></div><div id="grade"></div><canvas id="grain" width="320" height="180"></canvas>
<div id="name"><div id="nar"></div><div id="nen"></div></div>
<div class="bar" style="top:0"></div><div class="bar" style="bottom:0"></div><div id="tag">AI-imagined footage</div><div id="fade"></div>
</div>
<script>
const DUR=90, B="../../bulhan/";
const Q=(x,y)=>({img:B+"jinn-kings.webp",size:(x?"200%":"212%")+" 200%",pos:(x*100)+"% "+(y*100)+"%",w:1120,h:1470});
const H=x=>({img:B+"fever-fire.webp",size:"200% 100%",pos:(x*100)+"% 0",w:1100,h:1569});
const FULL=f=>({img:B+f,size:"100% 100%",pos:"0 0",w:1080,h:1417});
// a = start (s). from/to = [scale, x, y] of the painting; clips map their slow-motion frames across the shot.
const SHOTS=[
 {...FULL("jinn-kings.webp"),a:0,from:[1.02,0,250],to:[1.1,0,-230]},
 {...FULL("fever-fire.webp"),a:8.6,w:1240,h:883,k:1,from:[1.0,150,0],to:[1.08,-150,0]},
 {...Q(0,0),a:13.2,from:[1.15,0,230],to:[1.85,0,560]},
 {...Q(0,0),a:17.9,from:[1.0,0,130],to:[1.07,0,20]},
 {clip:"king",n:405,a:21.4},
 {...Q(0,1),a:30.3,from:[1.0,0,150],to:[1.08,0,-60]},
 {clip:"kabus",n:358,a:34.8},
 {...Q(1,1),a:45.0,from:[1.0,0,60],to:[1.75,330,430]},
 {...H(0),a:54.0,from:[1.0,0,200],to:[1.08,0,40]},
 {clip:"fever",n:310,a:57.2,y:68,z:1.2},
 {...H(1),a:63.6,from:[1.0,0,-120],to:[1.08,0,80]},
 {clip:"mountain",n:298,a:66.6},
 {...FULL("ikhtilaj.webp"),a:73.2,from:[1.05,0,300],to:[1.12,0,-260]},
 {...FULL("jinn-kings.webp"),a:80.6,from:[1.25,0,-120],to:[1.0,0,0]},
];
const NAMES=[[0.8,6,"كتاب البلهان","The Book of Wonders"],[22.6,29.6,"الملك الأحمر","The Red King"],[36.2,44.2,"الكابوس","Kābūs · The Nightmare"],
 [46.6,53.2,"شمهورش","Shamhūrash · Judge of the Jinn"],[58.2,63,"الحمّى","Fever"],[67.6,72.6,"جبل النار","The Mountain of Fire"],
 [74.6,79.8,"الاختلاج","The Twitching Chart"],[82.2,88.6,"كتاب البلهان","The Book of Wonders · Iraq, around 1400"]];
const cl=x=>Math.max(0,Math.min(1,x)),ease=x=>{x=cl(x);return x*x*(3-2*x)},$=s=>document.querySelector(s);
SHOTS.forEach((s,i)=>{s.b=i+1<SHOTS.length?SHOTS[i+1].a:DUR;const d=document.createElement("div");d.className="shot";
 if(s.clip){s.im=document.createElement("img");d.appendChild(s.im)}
 else{const bl=document.createElement("div");bl.className="blur";bl.style.backgroundImage=`url(${s.img})`;d.appendChild(bl);
  s.pt=document.createElement("div");s.pt.className="pt";Object.assign(s.pt.style,{width:s.w+"px",height:s.h+"px",marginLeft:-s.w/2+"px",marginTop:-s.h/2+"px",backgroundImage:`url(${s.img})`,backgroundSize:s.size,backgroundPosition:s.pos});d.appendChild(s.pt)}
 $("#shots").appendChild(d);s.el=d});
const g=$("#grain").getContext("2d"),gd=g.createImageData(320,180);
window.seek=async function(t){
 let tag=0;
 for(const s of SHOTS){const X=1.1,o=t<s.a?0:(t>s.b+X?0:ease((t-s.a)/X));s.el.style.opacity=o;s.el.style.visibility=o>0?"visible":"hidden";if(!(o>0))continue;
  const p=cl((t-s.a)/(s.b+X-s.a)),e=p*p*(3-2*p)*0.5+p*0.5;
  if(s.clip){const f=1+Math.round(p*(s.n-1)),src="work/slow/"+s.clip+"/"+String(f).padStart(4,"0")+".jpg";s.im.style.transform=`translateY(${s.y||0}px) scale(${(s.z||1.03)+0.07*p})`;
   if(s.im.dataset.s!==src){s.im.dataset.s=src;s.im.src=src;try{await s.im.decode()}catch(_){}}
   tag=Math.max(tag,Math.min(o,t>s.b?1-ease((t-s.b)/X):1))}
  else{const L=(a,b)=>a+(b-a)*e,K=s.k||s.w/820;s.pt.style.transform=`translate(${K*L(s.from[1],s.to[1])}px,${K*L(s.from[2],s.to[2])}px) scale(${L(s.from[0],s.to[0])})`}}
 $("#tag").style.opacity=tag*0.55;
 let no=0;for(const n of NAMES){if(t>=n[0]-0.1&&t<n[1]+0.1){no=Math.min(ease((t-n[0])/1.2),ease((n[1]-t)/0.9));$("#nar").textContent=n[2];$("#nen").textContent=n[3];
   $("#nen").style.letterSpacing=(0.34+0.1*cl((t-n[0])/(n[1]-n[0])))+"em";$("#name").style.transform=`translateY(${(1-ease((t-n[0])/1.4))*14}px)`}}
 $("#name").style.opacity=no;
 $("#fade").style.opacity=Math.max(1-ease(t/1.6),ease((t-87.4)/2.4));
 let sd=Math.floor(t*24)*7919+13;for(let i=0;i<gd.data.length;i+=4){sd=(sd*1103515245+12345)&0x7fffffff;const v=(sd>>16)&255;gd.data[i]=gd.data[i+1]=gd.data[i+2]=v;gd.data[i+3]=255}g.putImageData(gd,0,0);
};
document.fonts.ready.then(async()=>{await Promise.all(SHOTS.filter(s=>s.img).map(s=>{const i=new Image();i.src=s.img;return i.decode().catch(()=>{})}));
 await seek(+(new URLSearchParams(location.search).get("t")||0));window.READY=true});
</script></body></html>
