<!doctype html><html><head><meta charset="utf-8"><title>Blite — cinematic sales ad (editorial part, 17 s)</title>
<style>
@font-face{font-family:Figtree;src:url(/blite/figtree.woff2) format('woff2');font-weight:300 900}
:root{--ink:#121315;--paper:#F6F3EE;--stone:#ECE6DD;--ox:#6E1423;--ox2:#8A1E31}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:var(--ink);color:var(--paper);font-family:Figtree,sans-serif;-webkit-font-smoothing:antialiased}
.stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
#photos{position:absolute;inset:0;z-index:1}
.ph{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover;opacity:0;will-change:transform,opacity}
.scrim{position:absolute;inset:0;z-index:5;pointer-events:none;background:linear-gradient(0deg,rgba(10,10,12,.92) 0%,rgba(10,10,12,.55) 26%,rgba(10,10,12,0) 50%),linear-gradient(180deg,rgba(10,10,12,.55) 0%,rgba(10,10,12,0) 16%)}
.bars{position:absolute;left:0;right:0;height:0;background:#000;z-index:20}
.hl{position:absolute;left:80px;right:80px;bottom:300px;z-index:8;font-weight:600;font-size:118px;line-height:1.0;letter-spacing:-.025em;opacity:0}
.hl small{display:block;font-weight:500;font-size:34px;letter-spacing:.02em;line-height:1.4;color:rgba(246,243,238,.82);margin-top:30px}
.occ{display:flex;gap:18px;margin-top:34px}
.occ span{font-size:26px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:14px 22px;border:1.5px solid rgba(246,243,238,.5);border-radius:999px}
.tag{position:absolute;left:80px;bottom:150px;z-index:8;font-size:26px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:rgba(246,243,238,.9);opacity:0}
.tag b{color:#d8a3ad;margin-right:16px}
.top{position:absolute;left:80px;right:80px;top:120px;z-index:9;display:flex;justify-content:space-between;align-items:center;opacity:0}
.top img{height:38px}.top span{font-size:22px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:rgba(246,243,238,.8)}
.w{display:inline-block;will-change:transform,opacity,filter;white-space:pre}
#end{position:absolute;inset:0;z-index:30;background:radial-gradient(90% 60% at 50% 40%,#22201f 0%,#141416 60%,#0d0d0f 100%);opacity:0}
#end .wm{position:absolute;left:170px;right:170px;top:640px}
#end .wm img{width:100%;display:block}
#end .sub{position:absolute;left:0;right:0;top:860px;text-align:center;font-size:30px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(246,243,238,.78)}
#end .cta{position:absolute;left:50%;top:1010px;transform:translateX(-50%);background:var(--ox);color:var(--paper);font-weight:600;font-size:44px;padding:30px 70px;border-radius:999px;white-space:nowrap;box-shadow:0 20px 60px -10px rgba(110,20,35,.6)}
#end .addr{position:absolute;left:0;right:0;top:1200px;text-align:center;font-size:32px;line-height:1.55;color:rgba(246,243,238,.82)}
#end .url{position:absolute;left:0;right:0;top:1360px;text-align:center;font-size:40px;font-weight:600;letter-spacing:.04em}
.grain{position:absolute;inset:-60px;background:url(/media/grain.png);opacity:.06;mix-blend-mode:overlay;z-index:40}
.vig{position:absolute;inset:0;z-index:39;background:radial-gradient(130% 95% at 50% 45%,rgba(0,0,0,0) 58%,rgba(0,0,0,.5) 100%)}
.black{position:absolute;inset:0;background:#000;z-index:50}
.flash{position:absolute;inset:0;background:#fff;z-index:45;opacity:0;mix-blend-mode:soft-light}
</style></head><body>
<div class="stage" id="st"><div id="photos"></div><div class="scrim"></div>
<div class="top" id="top"><img src="/blite/blite-wordmark.svg"><span>The Fitting Room</span></div>
<div id="txt"></div>
<div id="end"><div class="wm"><img src="/blite/blite-wordmark.svg"></div><div class="sub">The Fitting Room</div><div class="cta">Book a fitting</div>
<div class="addr">37742 Van Dyke Ave<br>Sterling Heights, MI</div><div class="url">blite.app</div></div>
<div class="flash" id="flash"></div><div class="vig"></div><div class="grain" id="grain"></div><div class="black" id="black"></div></div>
<script src="lib/common.js"></script>
<script>
const P = $('#photos'), T = $('#txt');
const img = (f) => { const i = document.createElement('img'); i.className = 'ph'; i.src = `/blite/${f}.webp`; P.appendChild(i); return i; };
const div = (cls, html) => { const d = document.createElement('div'); d.className = cls; d.innerHTML = html; T.appendChild(d); return d; };
// shots: [image, start, end, focusY, label]
const SH = [
  ['F01', 0.0, 1.9, 40, ''], ['F05', 1.9, 3.6, 38, ''],
  ['F03', 3.6, 4.05, 35, 'Chalk-stripe three-piece'], ['F06', 4.05, 4.5, 35, 'Tan suit'], ['F09', 4.5, 4.95, 40, 'Rust suit'],
  ['F11', 4.95, 5.4, 38, 'Black suit'], ['F19', 5.4, 5.85, 40, 'Brown suit'], ['F08', 5.85, 6.3, 40, 'Grey suit'], ['F17', 6.3, 6.75, 40, 'Teal suit'],
  ['F12', 6.75, 9.0, 30, ''], ['F23', 9.0, 11.3, 40, ''], ['F20', 11.3, 13.8, 40, ''],
].map(([f, a, b, fy, lab], i) => { const im = img(f); im.style.objectPosition = `50% ${fy}%`; const t = lab ? div('tag', `<b>${String(i - 1).padStart(2, '0')}</b>${lab}`) : null; return { im, a, b, t, i }; });
const H = [
  [0.25, 1.85, '<span class="t">Eighty looks.</span>'],
  [2.1, 3.55, '<span class="t">Four occasions.</span><div class="occ"><span>Casual</span><span>Formal</span><span>Wedding</span><span>Tuxedo</span></div>'],
  [6.95, 8.95, '<span class="t">Pick a look.</span><small>Choose your sizes.</small>'],
  [9.2, 11.25, '<span class="t">The whole outfit,<br>on your rail.</span>'],
  [11.5, 13.7, '<span class="t">Fitted in store.</span><small>A stylist confirms the fit.</small>'],
].map(([a, b, h]) => { const d = div('hl', h); const ws = splitWords($('.t', d)); return { d, a, b, ws }; });
window.__ready = Promise.all([document.fonts.load('600 40px Figtree'), ...SH.map((s) => s.im.decode().catch(() => 0))]).then(() => true);
window.seek = async (t) => {
  $('#black').style.opacity = (1 - E.inOutSine(seg(t, 0, 0.4))).toFixed(3);
  SH.forEach((s) => {
    const on = t >= s.a && t < s.b + (s.i >= 9 ? 0.3 : 0);
    const k = seg(t, s.a, s.b + 0.3);
    const fast = s.b - s.a < 0.6;
    let o = on ? 1 : 0;
    if (!fast && s.i >= 9) o = env(t, s.a - 0.01, s.a + 0.3, s.b, s.b + 0.3, E.inOutSine, E.inOutSine);
    s.im.style.opacity = o.toFixed(3); s.im.style.zIndex = 1 + s.i;
    const sc = fast ? 1.16 - 0.08 * E.outCubic(seg(t, s.a, s.b)) : 1.12 - 0.1 * E.smooth(k);
    s.im.style.transform = `scale(${sc.toFixed(4)}) translateY(${(-20 * k).toFixed(1)}px)`;
    if (s.t) s.t.style.opacity = on ? 1 : 0;
  });
  // whip flash on fast cuts
  const cuts = SH.filter((s) => s.b - s.a < 0.6).map((s) => s.a); let fl = 0; cuts.forEach((c) => { if (t >= c && t < c + 0.12) fl = Math.max(fl, 1 - (t - c) / 0.12); });
  $('#flash').style.opacity = (fl * 0.5).toFixed(3);
  H.forEach((h) => { h.d.style.opacity = env(t, h.a, h.a + 0.25, h.b - 0.3, h.b).toFixed(3); animWords(h.ws, t, h.a, 0.07, 0.8, null, { dy: 46, blur: 10 });
    const sm = $('small', h.d) || $('.occ', h.d); if (sm) { const q = E.outCubic(seg(t, h.a + 0.45, h.a + 1.0)); sm.style.opacity = q; sm.style.transform = `translateY(${(1 - q) * 24}px)`; } });
  $('#top').style.opacity = (E.outCubic(seg(t, 0.4, 1.2)) * (1 - seg(t, 13.6, 13.9))).toFixed(3);
  const e = E.inOutSine(seg(t, 13.8, 14.4)); const end = $('#end'); end.style.opacity = e.toFixed(3);
  const wq = E.outQuart(seg(t, 14.0, 15.0)); $('.wm', end).style.transform = `translateY(${(1 - wq) * 40}px) scale(${(1.06 - 0.06 * wq).toFixed(3)})`; $('.wm', end).style.filter = `blur(${((1 - wq) * 10).toFixed(1)}px)`;
  [['.sub', 14.5], ['.cta', 14.8], ['.addr', 15.1], ['.url', 15.3]].forEach(([s, a]) => { const q = E.outCubic(seg(t, a, a + 0.6)); const el = $(s, end); el.style.opacity = q;
    el.style.transform = (s === '.cta' ? 'translateX(-50%) ' : '') + `translateY(${(1 - q) * 26}px)`; });
  grainJitter($('#grain'), t);
};
</script></body></html>
