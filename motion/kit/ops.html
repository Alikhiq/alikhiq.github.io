<!doctype html><html><head><meta charset="utf-8"><title>Ops dashboard videos: a client build shown as a live node graph (ops.html?v=&lt;id&gt;, configs in lib/ops-videos.js)</title>
<link rel="stylesheet" href="lib/common.css">
<style>
/* A "mission control" view of a real client build: inputs on the left, wires through a spine, one module per
   catalogue category on the right, and a running total. Every count is the client's real number. */
@font-face{font-family:JBM;src:url('/__fonts/jbmono.woff2') format('woff2');font-weight:100 800}
@font-face{font-family:Figtree;src:url('/__fonts/figtree.woff2') format('woff2');font-weight:300 900}
@font-face{font-family:Anton;src:url('/__fonts/anton.woff2') format('woff2')}
body{--bg:#0b0c0e;--line:rgba(255,255,255,.13);--dim:rgba(255,255,255,.45);--ink:#f3efe8;--ok:#b9d98a}
body.blite{--acc:#ff8fb0;--acc2:#E4D3BC;--disp:Figtree,sans-serif}
body.hny{--acc:#e3be55;--acc2:#ff8a70;--disp:Anton,sans-serif}
.stage{background:var(--bg)}
#root{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform,filter}
#dash{position:absolute;inset:0;font-family:JBM,monospace;color:var(--ink);transform-origin:50% 55%}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:54px 54px}
.head{position:absolute;left:56px;right:56px;top:236px;z-index:6}
.tag{display:inline-block;padding:11px 22px;border-radius:8px;box-shadow:inset 0 0 0 2px var(--acc);font-family:JBM;font-weight:600;font-size:25px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.hd{margin-top:22px;font-family:var(--disp);font-size:112px;line-height:1;color:var(--ink)}
.blite .hd{font-weight:500;letter-spacing:-.045em}.blite .hd em{font-style:normal;font-weight:300;color:var(--acc2)}
.hny .hd{text-transform:uppercase;font-size:130px}.hny .hd em{font-style:normal;color:var(--acc)}
.hd em .w{background:none;-webkit-text-fill-color:currentColor;color:inherit;padding:0;margin:0}
.bar{position:absolute;left:40px;right:40px;top:552px;height:44px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:20px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
.bar b{color:var(--ink);font-weight:600}.bar i{font-style:normal;color:var(--acc)}
.pn{position:absolute;background:rgba(255,255,255,.028);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.pn .t{display:flex;justify-content:space-between;align-items:center;height:34px;padding:0 10px;font-size:19px;font-weight:700;letter-spacing:.02em;border-bottom:1px solid var(--line)}
.pn .t span{font-weight:400;font-size:15px;color:var(--dim);text-transform:lowercase}
.pn.run{box-shadow:inset 0 0 0 2px var(--acc),0 0 34px -6px var(--acc)}.pn.run .t{background:var(--acc);color:#0b0c0e}.pn.run .t span{color:#0b0c0e}
.pn.done .t span{color:var(--ok)}
.kv{display:flex;justify-content:space-between;padding:3px 10px;font-size:16px;color:var(--dim)}.kv b{color:var(--ink);font-weight:500}
.spark{position:absolute;left:10px;right:10px;bottom:9px;height:30px;display:flex;align-items:flex-end;gap:3px}.spark u{flex:1;background:var(--ink);opacity:.8;display:block}
.pn.in.on .spark u{background:var(--acc)}
.th{position:absolute;left:8px;right:8px;top:42px;bottom:62px;overflow:hidden;background:#000}
.th img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.1) brightness(.45)}
.th .c{position:absolute;inset:0;overflow:hidden}.th .c img{filter:none}
.th .scan{position:absolute;left:0;right:0;height:3px;background:var(--acc);box-shadow:0 0 18px 3px var(--acc);opacity:0}
.ct{position:absolute;left:10px;right:10px;bottom:22px;display:flex;justify-content:space-between;align-items:baseline;font-size:17px;color:var(--dim)}
.ct b{font-size:33px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pg{position:absolute;left:10px;right:10px;bottom:9px;height:6px;background:rgba(255,255,255,.1)}.pg u{display:block;height:100%;width:0;background:var(--acc)}
.pn.done .pg u{background:var(--ok)}
#wires{position:absolute;inset:0;z-index:1;pointer-events:none}
#wires path{fill:none;stroke:rgba(255,255,255,.14);stroke-width:1.4}
#wires path.hot{stroke:var(--acc);stroke-width:2.4;opacity:.95}
#wires circle{fill:var(--acc)}
#spine{position:absolute;left:372px;top:618px;width:26px;height:780px;z-index:2;box-shadow:inset 0 0 0 1px var(--line);background:repeating-linear-gradient(180deg,rgba(255,255,255,.1) 0 2px,transparent 2px 13px)}
.log{position:absolute;left:10px;right:10px;top:42px;bottom:8px;overflow:hidden;font-size:16.5px;line-height:25px;color:var(--dim)}
.log div{white-space:nowrap}.log div b{color:var(--ink);font-weight:500}.log div.cur{color:#0b0c0e;background:var(--acc)}.log div.cur b{color:#0b0c0e}
#tot{position:absolute;left:14px;top:40px;font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink)}
#totl{position:absolute;left:18px;top:206px;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#totl b{color:var(--acc)}
.cmd{position:absolute;left:40px;right:40px;top:1716px;font-size:20px;color:var(--dim)}.cmd b{color:var(--acc)}
/* reveal: the live site, then the client end card */
#rev{position:absolute;inset:0;z-index:8;opacity:0;background:var(--bg)}
#rev .pwrap{position:absolute;left:0;right:0;top:520px;perspective:2400px}
.phone{position:relative;margin:0 auto;width:640px;height:1340px;border-radius:92px;background:#0a0a10;padding:16px;box-shadow:0 0 0 3px rgba(255,255,255,.3),0 0 140px -10px var(--acc)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:78px;overflow:hidden;background:#fff}.phone .scr img{position:absolute;left:0;top:0;width:100%}
.phone .isl{position:absolute;left:50%;top:38px;width:170px;height:46px;margin-left:-85px;border-radius:30px;background:#000;z-index:2}
#rhead{position:absolute;left:40px;right:40px;top:240px;text-align:center}
#end{position:absolute;inset:0;z-index:10;opacity:0;display:flex;flex-direction:column;align-items:center;text-align:center;font-family:Figtree,sans-serif}
.blite #end{background:#F6F3EE;color:#1D1F23}.hny #end{background:radial-gradient(110% 70% at 50% 45%,#8a1c28 0%,#6e161f 40%,#3a0a10 100%);color:#fbf6ec}
#e1{margin-top:430px;font-weight:700;font-size:40px;letter-spacing:.3em;text-transform:uppercase}
#e2{font-family:var(--disp);font-size:330px;font-weight:600;letter-spacing:-.06em;line-height:.95;margin-top:10px}
.hny #e2{font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:400px}
#erule{width:300px;height:4px;margin-top:40px;background:#6E1423}.hny #erule{background:#e3be55;height:6px}
#e3{margin-top:44px;font-weight:500;font-size:40px}
#ecta{margin-top:70px;padding:34px 90px;border-radius:80px;font-weight:800;font-size:52px;background:#6E1423;color:#F6F3EE}.hny #ecta{background:#e3be55;color:#3a0a10}
#eurl{margin-top:36px;font-weight:600;font-size:44px}
#eby{position:absolute;left:0;right:0;top:1440px;font-weight:600;font-size:28px;letter-spacing:.18em;text-transform:uppercase;opacity:0}
#flash{z-index:9;background:#fff;opacity:0;mix-blend-mode:overlay}
</style></head><body>
<div class="stage" id="stage">
  <div id="root"><div id="dash"><div id="grid"></div><svg id="wires" viewBox="0 0 1080 1920"></svg><div id="spine"></div></div>
    <div id="rev"><div id="rhead"></div><div class="pwrap"><div class="phone"><div class="scr"><img id="site"></div><div class="isl"></div></div></div></div></div>
  <div class="layer" id="flash"></div>
  <div id="end"><div id="e1"></div><div id="e2"></div><div id="erule"></div><div id="e3"></div><div id="ecta"></div><div id="eurl"></div><div id="eby"></div></div>
  <div class="grain" id="grain"></div>
</div>
<script src="lib/common.js"></script><script src="lib/ops-videos.js"></script>
<script>
const ID = new URLSearchParams(location.search).get('v') || 'o1';
const C = OPS[ID]; document.body.classList.add(C.brand);
const dash = $('#dash'), R = rng(C.seed || 7), loads = [];
const mk = (p, cls, html, css) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; if (css) Object.assign(d.style, css); p.appendChild(d); return d; };
const words = (el) => { splitWords(el); return $$('.w', el); };
function slam(ws, t, t0, step = 0.1, d = 0.34) { ws.forEach((w, i) => { const k = E.outExpo(seg(t, t0 + i * step, t0 + i * step + d)); w.style.opacity = k.toFixed(3);
  w.style.transform = `translateY(${((1 - k) * 40).toFixed(1)}px) scale(${(1 + 0.4 * (1 - k)).toFixed(3)})`; w.style.filter = k < 0.985 ? `blur(${((1 - k) * 10).toFixed(1)}px)` : 'none'; }); }
const img = (n) => `/collab/${C.brand}/${n}.jpg`;
const sparkHTML = (n) => `<div class="spark">${Array.from({ length: n }, () => `<u data-h="${(0.25 + R() * 0.75).toFixed(2)}"></u>`).join('')}</div>`;

// ---- build ----
const head = mk(dash, 'head', `<div class="tag">${C.tag}</div><div class="hd">${C.head}</div>`); const WH = words($('.hd', head));
const bar = mk(dash, 'bar', `<span>graph <b>${C.graph}</b></span><span>nodes <b>${C.inputs.length + C.modules.length + 2}</b></span><span>client / <b>round city</b></span><span><i id="clk"></i></span>`);
const IH = (780 - (C.inputs.length - 1) * 14) / C.inputs.length;
const ins = C.inputs.map((p, i) => { const el = mk(dash, 'pn in', `<div class="t">${p.name}<span>input</span></div>${p.rows.map(([k, v]) => `<div class="kv"><span>${k}</span><b>${v}</b></div>`).join('')}${sparkHTML(22)}`, { left: '40px', top: 618 + i * (IH + 14) + 'px', width: '300px', height: IH + 'px' }); return { el, y: 618 + i * (IH + 14) + IH / 2 }; });
const cols = 2, rows = Math.ceil(C.modules.length / cols), MW = 302, MH = (780 - (rows - 1) * 12) / rows, STEP = C.step || 0.82, RUN = C.run || 1.15, T0 = C.t0 || 1.5;
const mods = C.modules.map((m, i) => { const cx = i % cols, cy = Math.floor(i / cols); const x = 430 + cx * (MW + 12), y = 618 + cy * (MH + 12);
  const el = mk(dash, 'pn', `<div class="t">${m.name}<span class="s">queued</span></div><div class="th"><img src="${img(m.img)}"><div class="c"><img src="${img(m.img)}"></div><div class="scan"></div></div><div class="ct"><span>${m.unit || 'styles'}</span><b>0</b></div><div class="pg"><u></u></div>`, { left: x + 'px', top: y + 'px', width: MW + 'px', height: MH + 'px' });
  $$('img', el).forEach((im) => loads.push(im.decode().catch(() => {})));
  return { ...m, el, x, y: y + MH / 2, a: T0 + i * STEP, s: $('.s', el), c: $('.c', el), scan: $('.scan', el), b: $('.ct b', el), u: $('.pg u', el), thH: MH - 104 }; });
const LAND = T0 + (mods.length - 1) * STEP + RUN, TOTAL = C.modules.reduce((a, m) => a + m.n, 0);
// wires: inputs -> spine -> modules; a few dim extras per module for density
const svg = $('#wires'), NS = 'http://www.w3.org/2000/svg'; const wires = [];
mods.forEach((m, i) => { for (let j = 0; j < 4; j++) { const src = ins[(i + j * 2 + (j ? Math.floor(R() * 3) : 0)) % ins.length]; const y0 = src.y + (R() - 0.5) * (IH - 40), ys = 640 + R() * 740, y1 = m.y + (R() - 0.5) * 60;
  const x1 = m.x, d = `M340,${y0.toFixed(0)} C362,${y0.toFixed(0)} 352,${ys.toFixed(0)} 385,${ys.toFixed(0)} C${(x1 > 600 ? 420 : 410)},${ys.toFixed(0)} ${(x1 > 600 ? 400 : 402)},${y1.toFixed(0)} ${x1 > 600 ? 430 + MW + 6 : 430},${y1.toFixed(0)}`;
  const p = document.createElementNS(NS, 'path'); p.setAttribute('d', x1 > 600 ? `M340,${y0.toFixed(0)} C362,${y0.toFixed(0)} 352,${ys.toFixed(0)} 385,${ys.toFixed(0)} C412,${ys.toFixed(0)} 398,${(m.y - MH / 2 - 6).toFixed(0)} 424,${(m.y - MH / 2 - 6).toFixed(0)} L${x1 + 20},${(m.y - MH / 2 - 6).toFixed(0)} L${x1 + 20},${(m.y - MH / 2).toFixed(0)}` : d); svg.appendChild(p);
  const dots = j < 2 ? [0, 1].map(() => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 5); svg.appendChild(c); return c; }) : []; wires.push({ p, m, main: j < 2, dots, len: p.getTotalLength(), off: R(), src }); } });
const logP = mk(dash, 'pn', `<div class="t">run log<span>tail -f</span></div><div class="log"></div>`, { left: '40px', top: '1416px', width: '560px', height: '284px' }); const logEl = $('.log', logP);
const LOGS = [[0.5, 'load', 'brief + floor photos']].concat(...mods.map((m) => [[m.a, 'start', m.name.toLowerCase()], [m.a + RUN, 'done', `${m.name.toLowerCase()} <b>+${m.n}</b>`]]), [[LAND + 0.15, 'publish', `<b>${C.graph}</b> live`]]).sort((a, b) => a[0] - b[0]);
const logRows = LOGS.map(([a, k, s]) => { const d = mk(logEl, '', `t+${a.toFixed(1).padStart(4, '0')}&nbsp;&nbsp;<b>${k.padEnd(8, ' ').replace(/ /g, '&nbsp;')}</b>${s}`); return { d, a }; });
const outP = mk(dash, 'pn', `<div class="t">output<span>${C.totalUnit}</span></div><div id="tot">0</div><div id="totl">${C.totalLabel}</div>${sparkHTML(30)}`, { left: '612px', top: '1416px', width: '428px', height: '284px' });
mk(dash, 'cmd', `<b>~/roundcity</b> $ ${C.cmd}<span id="cur">▌</span>`);
$('#rhead').innerHTML = `<div class="tag">${C.reveal.tag}</div><div class="hd" style="font-size:${C.reveal.size || 104}px">${C.reveal.head}</div>`; const WR = words($('#rhead .hd'));
const site = $('#site'); site.src = img('site'); loads.push(site.decode().catch(() => {}));
const en = C.end; $('#e1').textContent = en.over; $('#e2').textContent = en.name; $('#e3').innerHTML = en.line; $('#ecta').textContent = en.cta; $('#eurl').textContent = en.url; $('#eby').textContent = 'Website by Round City · roundcity.co';
const WE = words($('#e2'));
const REV = LAND + (C.hold || 1.5), REVDUR = C.revDur || 3.0, END = REV + REVDUR, ENDDUR = 3.8; window.__DUR = END + ENDDUR;
window.__EVENTS = { cuts: [REV, END], hits: [LAND], risers: [LAND], pops: mods.map((m) => m.a), end: END, dur: END + ENDDUR };
const fadeUp = (el, t, a, d = 0.45, dy = 28) => { const k = E.outQuart(seg(t, a, a + d)); el.style.opacity = k.toFixed(3); el.style.transform = `translateY(${((1 - k) * dy).toFixed(1)}px)`; };
window.__ready = document.fonts.ready.then(() => Promise.all(loads)).then(() => true);
window.seek = async (t) => {
  // dashboard
  slam(WH, t, -1); $('#clk').textContent = `t+${t.toFixed(2).padStart(5, '0')}s`; $('#cur').style.opacity = Math.floor(t * 3) % 2 ? 1 : 0;
  const boot = (i) => E.outExpo(seg(t, -0.9 + i * 0.05, -0.4 + i * 0.05)); // already on screen in frame 0 (the cover frame)
  ins.forEach((p, i) => { p.el.style.opacity = boot(i).toFixed(3); p.el.style.transform = `translateX(${((1 - boot(i)) * -60).toFixed(1)}px)`; });
  let total = 0, active = null;
  mods.forEach((m, i) => { const b = boot(i + 2); m.el.style.opacity = b.toFixed(3); m.el.style.transform = `translateY(${((1 - b) * 50).toFixed(1)}px)`;
    const k = seg(t, m.a, m.a + RUN), e = E.inOut(k); const st = k <= 0 ? 'queued' : k < 1 ? 'running' : 'done'; if (st === 'running') active = m;
    m.el.classList.toggle('run', st === 'running'); m.el.classList.toggle('done', st === 'done'); m.s.textContent = st === 'running' ? Math.round(e * 100) + '%' : st;
    m.c.style.clipPath = `inset(0 0 ${((1 - e) * 100).toFixed(2)}% 0)`; m.scan.style.opacity = st === 'running' ? 1 : 0; m.scan.style.top = (e * m.thH).toFixed(1) + 'px';
    const n = Math.round(m.n * e); m.b.textContent = n; m.u.style.width = (e * 100).toFixed(1) + '%'; total += n; });
  ins.forEach((p) => p.el.classList.remove('on'));
  wires.forEach((w) => { const k = seg(t, w.m.a, w.m.a + RUN), hot = w.main && k > 0 && k < 1; w.p.classList.toggle('hot', hot); if (hot) w.src.el.classList.add('on');
    w.dots.forEach((c, j) => { if (!hot) { c.style.opacity = 0; return; } const q = (k * 1.8 + w.off + j * 0.5) % 1, pt = w.p.getPointAtLength(q * w.len); c.setAttribute('cx', pt.x.toFixed(1)); c.setAttribute('cy', pt.y.toFixed(1)); c.style.opacity = 1; }); });
  $$('.spark u').forEach((u, i) => { const h = +u.dataset.h; u.style.height = (100 * clamp(h * (0.55 + 0.45 * Math.sin(t * 5 + i * 1.7)))).toFixed(0) + '%'; });
  const p = seg(t, LAND, LAND + 0.4), tot = $('#tot'); tot.textContent = total; tot.style.color = t >= LAND ? 'var(--acc)' : ''; tot.style.transform = `scale(${(1 + 0.16 * Math.sin(p * Math.PI) * (1 - p)).toFixed(3)})`; tot.style.transformOrigin = '0 60%';
  outP.classList.toggle('run', t >= LAND);
  let shown = 0; logRows.forEach((r) => { const on = t >= r.a; r.d.style.display = on ? 'block' : 'none'; r.d.classList.remove('cur'); if (on) shown++; }); if (shown) logRows[shown - 1].d.classList.add('cur');
  logEl.scrollTop = 0; logEl.style.transform = 'none'; const over = Math.max(0, shown * 25 - 228); logRows.forEach((r) => { r.d.style.transform = `translateY(${-over}px)`; });
  // slow push toward the module that is running, then settle wide for the total
  const z = 1 + 0.05 * E.inOutSine(seg(t, T0, LAND)) - 0.05 * E.inOutSine(seg(t, LAND, LAND + 0.6)); dash.style.transform = `scale(${z.toFixed(4)})`;
  // reveal + end
  const tr = t - REV, te = t - END; $('#rev').style.opacity = tr >= 0 && te < 0 ? 1 : 0; dash.style.opacity = tr >= 0 ? 0 : 1;
  if (tr >= 0 && te < 0) { const k = E.outExpo(seg(tr, 0, 0.8)), m = seg(tr, 0, REVDUR); const ph = $('#rev .phone'); slam(WR, tr, 0.08); fadeUp($('#rhead .tag'), tr, 0.05, 0.35, 18);
    ph.style.transform = `translateY(${((1 - k) * 420).toFixed(1)}px) rotateY(${lerp(-16, 10, E.inOutSine(m)).toFixed(2)}deg) rotateX(${(7 - 4 * m).toFixed(2)}deg) scale(${(0.96 + 0.06 * m).toFixed(4)})`;
    site.style.transform = `translateY(${(-(C.reveal.scroll || 2200) * E.inOut(seg(tr, 0.4, REVDUR - 0.1))).toFixed(1)}px)`; }
  $('#end').style.opacity = te >= 0 ? 1 : 0;
  if (te >= 0) { fadeUp($('#e1'), te, 0.1, 0.4, 20); slam(WE, te, 0.2, 0.1, 0.45); $('#erule').style.transform = `scaleX(${E.outExpo(seg(te, 0.5, 1.1)).toFixed(3)})`; fadeUp($('#e3'), te, 0.75, 0.45, 20);
    const c = E.outExpo(seg(te, 1.1, 1.7)); $('#ecta').style.opacity = c.toFixed(3); $('#ecta').style.transform = `translateY(${((1 - c) * 40).toFixed(1)}px) scale(${(0.85 + 0.15 * c).toFixed(3)})`; fadeUp($('#eurl'), te, 1.4, 0.45, 16); $('#eby').style.opacity = (seg(te, 1.8, 2.3) * 0.7).toFixed(3); }
  let amt = 0, dir = 1; [REV, END].forEach((c) => { const d = t - c; if (Math.abs(d) < 0.24) { const a = 1 - Math.abs(d) / 0.24; if (a > amt) { amt = a; dir = d < 0 ? 1 : -1; } } }); amt = E.inOutSine(amt);
  let sx = 0, sy = 0; const dh = t - LAND; if (dh >= 0 && dh < 0.45) { const k = Math.pow(1 - dh / 0.45, 2); sx = Math.sin(dh * 95) * 16 * k; sy = Math.cos(dh * 80) * 12 * k; }
  const RT = te >= 0 ? $('#end') : $('#root'); $('#root').style.transform = $('#end').style.transform = 'none'; $('#root').style.filter = $('#end').style.filter = 'none';
  RT.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${(1 + 0.14 * amt).toFixed(4)}) rotate(${(dir * 1.6 * amt).toFixed(3)}deg)`; RT.style.filter = amt > 0.01 ? `blur(${(amt * 12).toFixed(2)}px)` : 'none';
  const fl = Math.max(0, 1 - Math.abs(t - REV) / 0.16, 1 - Math.abs(t - END) / 0.16, dh >= 0 ? 1 - dh / 0.22 : 0); $('#flash').style.opacity = (fl * 0.5).toFixed(3);
  grainJitter($('#grain'), t); await flushDecodes();
};
</script></body></html>
