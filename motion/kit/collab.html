<!doctype html><html><head><meta charset="utf-8"><title>Client collab videos: real client photos, client look (collab.html?v=&lt;id&gt;, configs in lib/collab-videos.js)</title>
<link rel="stylesheet" href="lib/common.css">
<style>
/* Each video wears the client's own look (fonts and colors taken from their live site), not Round City's.
   Photos are the client's published site images. Text stays inside y 230..1500, clear of Instagram's UI. */
@font-face{font-family:Anton;src:url('/__fonts/anton.woff2') format('woff2')}
@font-face{font-family:Figtree;src:url('/__fonts/figtree.woff2') format('woff2');font-weight:300 900}
body.hny{--bg:radial-gradient(110% 70% at 50% 45%,#8a1c28 0%,#6e161f 40%,#3a0a10 100%);--ink:#fbf6ec;--acc:#e3be55;--disp:Anton,Impact,sans-serif;--body:"DM Sans",sans-serif;--chipbg:rgba(227,190,85,.16);--card:rgba(58,10,16,.78)}
body.blite{--bg:linear-gradient(180deg,#2a2c31 0%,#1D1F23 100%);--ink:#F6F3EE;--acc:#E4D3BC;--disp:Figtree,sans-serif;--body:Figtree,sans-serif;--chipbg:rgba(246,243,238,.14);--card:rgba(29,31,35,.78)}
.stage{background:var(--bg)}
.sc{position:absolute;inset:0;z-index:5;opacity:0;overflow:hidden;background:var(--bg)}
.ph{position:absolute;left:0;top:0;max-width:none;will-change:transform}
.ph.dim{filter:blur(14px) brightness(.36) saturate(1.1)}
.shade{position:absolute;inset:0;z-index:1}
.shade.top{background:linear-gradient(180deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.5) 28%,rgba(0,0,0,0) 52%,rgba(0,0,0,.35) 100%)}
.shade.bottom{background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.25) 50%,rgba(0,0,0,.82) 78%,rgba(0,0,0,.9) 100%)}
.shade.mid{background:radial-gradient(75% 45% at 50% 45%,rgba(0,0,0,.72) 0%,rgba(0,0,0,.45) 70%,rgba(0,0,0,.3) 100%)}
.tx{position:absolute;left:64px;right:56px;z-index:4;display:flex;flex-direction:column;align-items:flex-start;gap:26px}
.tx.c{align-items:center;text-align:center;left:40px;right:40px}
.tag{padding:13px 26px;border-radius:40px;background:var(--chipbg);box-shadow:inset 0 0 0 2px var(--acc);font-family:var(--body);font-weight:700;font-size:28px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.hd{font-family:var(--disp);color:var(--ink);text-shadow:0 6px 44px rgba(0,0,0,.6)}
.hny .hd{font-size:210px;line-height:.98;text-transform:uppercase;letter-spacing:.005em}
.hny .hd em{font-style:normal;color:var(--acc)}
.blite .hd{font-size:150px;line-height:1;font-weight:500;letter-spacing:-.045em}
.blite .hd em{font-style:normal;font-weight:300;color:var(--acc)}
.hd em .w{background:none;-webkit-text-fill-color:currentColor;color:inherit;padding:0;margin:0}
.sub{font-family:var(--body);font-weight:500;font-size:40px;line-height:1.3;color:var(--ink);opacity:0;text-shadow:0 2px 20px rgba(0,0,0,.7)}
.food{position:absolute;z-index:2;left:0;width:1080px;will-change:transform;filter:drop-shadow(0 60px 80px rgba(0,0,0,.55))}
.food{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 86%,transparent 100%)}
.food.lit{mix-blend-mode:screen;filter:none;-webkit-mask-image:none;mask-image:none}
.num{position:absolute;left:0;right:0;text-align:center;z-index:4;font-family:var(--disp);color:var(--acc);font-variant-numeric:tabular-nums;line-height:.9;text-shadow:0 10px 60px rgba(0,0,0,.65)}
.blite .num{font-weight:600;letter-spacing:-.06em;color:var(--ink)}
.rows{position:absolute;left:56px;right:56px;z-index:4;display:grid;gap:20px}
.row{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:30px 38px;border-radius:26px;background:var(--card);box-shadow:inset 0 0 0 2px rgba(255,255,255,.14)}
.row .l{font-family:var(--disp);color:var(--ink);font-size:62px;line-height:1}
.hny .row .l{text-transform:uppercase;letter-spacing:.01em}
.blite .row .l{font-weight:500;letter-spacing:-.03em;font-size:64px}
.blite .row{padding:44px 40px}.blite .row .r{font-size:46px;color:var(--ink)}
.row .r{flex:none;font-family:var(--body);font-weight:600;font-size:40px;color:var(--acc);text-align:right}
.row b{flex:none;width:76px;height:76px;border-radius:50%;background:var(--acc);color:#3a0a10;font-family:var(--disp);font-size:46px;display:grid;place-items:center;font-weight:400}
.row .lw{display:flex;align-items:center;gap:26px}
.pwrap{position:absolute;left:0;right:0;z-index:3;perspective:2400px}
.phone{position:relative;margin:0 auto;width:640px;height:1340px;border-radius:92px;background:#0a0a10;padding:16px;box-shadow:0 0 0 3px rgba(255,255,255,.3),0 80px 140px -30px rgba(0,0,0,.9)}
.phone .scr{position:relative;width:100%;height:100%;border-radius:78px;overflow:hidden;background:#fff}
.phone .scr img{position:absolute;left:0;top:0;width:100%;display:block}
.phone .isl{position:absolute;left:50%;top:38px;width:170px;height:46px;margin-left:-85px;border-radius:30px;background:#000;z-index:2}
/* end card */
#end{position:absolute;inset:0;z-index:10;opacity:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.hny #end{background:var(--bg);color:#fbf6ec}
.blite #end{background:#F6F3EE;color:#1D1F23}
#e1{margin-top:430px;font-family:var(--body);font-weight:700;font-size:40px;letter-spacing:.3em;text-transform:uppercase}
.hny #e1{font-family:Anton;font-weight:400;font-size:84px;letter-spacing:.06em}
#e2{font-family:var(--disp);line-height:.95}
.hny #e2{font-size:400px;text-transform:uppercase;letter-spacing:.02em;margin-top:26px}
.blite #e2{font-size:330px;font-weight:600;letter-spacing:-.06em;margin-top:10px}
#erule{width:300px;height:6px;margin:30px 0 0;background:#e3be55;border-radius:3px}
.blite #erule{background:#6E1423;height:4px;margin-top:40px}
#e3{margin-top:44px;font-family:var(--body);font-weight:500;font-size:40px;line-height:1.35}
#ecta{margin-top:70px;padding:34px 90px;border-radius:80px;font-family:var(--body);font-weight:800;font-size:52px;white-space:nowrap}
.hny #ecta{background:#e3be55;color:#3a0a10}.blite #ecta{background:#6E1423;color:#F6F3EE}
#eurl{margin-top:36px;font-family:var(--body);font-weight:600;font-size:44px}
#eby{position:absolute;left:0;right:0;top:1440px;font-family:var(--body);font-weight:600;font-size:28px;letter-spacing:.18em;text-transform:uppercase;opacity:.7}
#root{position:absolute;inset:0;transform-origin:50% 45%;will-change:transform,filter}
#flash{z-index:9;background:#fff;opacity:0;mix-blend-mode:overlay}
</style></head><body>
<div class="stage" id="stage">
  <div id="root"></div><div class="layer" id="flash"></div>
  <div id="end"><div id="e1"></div><div id="e2"></div><div id="erule"></div><div id="e3"></div><div id="ecta"></div><div id="eurl"></div><div id="eby"></div></div>
  <div class="grain" id="grain"></div>
</div>
<script src="lib/common.js"></script><script src="lib/collab-videos.js"></script>
<script>
const ID = new URLSearchParams(location.search).get('v') || 'h1';
const CFG = COLLAB[ID], BR = BRANDS[CFG.brand];
document.body.classList.add(CFG.brand);
const root = $('#root');
const mk = (p, cls, html, css) => { const d = document.createElement('div'); d.className = cls; if (html != null) d.innerHTML = html; if (css) Object.assign(d.style, css); p.appendChild(d); return d; };
const words = (el) => { splitWords(el); return $$('.w', el); };
function slam(ws, t, t0, step = 0.11, d = 0.34) { ws.forEach((w, i) => { const k = E.outExpo(seg(t, t0 + i * step, t0 + i * step + d));
  w.style.opacity = k.toFixed(3); w.style.transform = `translateY(${((1 - k) * 50).toFixed(1)}px) scale(${(1 + 0.45 * (1 - k)).toFixed(3)})`; w.style.filter = k < 0.985 ? `blur(${((1 - k) * 12).toFixed(1)}px)` : 'none'; }); }
const fadeUp = (el, t, a, d = 0.45, dy = 28) => { const k = E.outQuart(seg(t, a, a + d)); el.style.opacity = k.toFixed(3); el.style.transform = `translateY(${((1 - k) * dy).toFixed(1)}px)`; };
const src = (n) => (/\//.test(n) ? n : `/collab/${CFG.brand}/${n}.jpg`);
const loads = [];
// full-bleed photo with a slow push and pan. fx/fy = which part stays in frame (0..1), *0 -> *1 pans.
function photo(L, s, dim) { const im = document.createElement('img'); im.className = 'ph' + (dim ? ' dim' : ''); im.src = src(s.img); L.appendChild(im); loads.push(im.decode().catch(() => {}));
  return (k) => { const W = im.naturalWidth || 1080, H = im.naturalHeight || 1920; const z = lerp(s.z0 ?? 1.05, s.z1 ?? 1.17, k) + (dim ? 0.06 : 0); const sc = Math.max(1080 / W, 1920 / H) * z, w = W * sc, h = H * sc;
    const fx = lerp(s.fx0 ?? s.fx ?? 0.5, s.fx1 ?? s.fx ?? 0.5, k), fy = lerp(s.fy0 ?? s.fy ?? 0.5, s.fy1 ?? s.fy ?? 0.5, k);
    im.style.width = w.toFixed(1) + 'px'; im.style.transform = `translate(${(-(w - 1080) * fx).toFixed(1)}px,${(-(h - 1920) * fy).toFixed(1)}px)`; }; }
// text block: optional tag, big lines, optional sub line
function text(L, s, def) { const pos = s.pos || def; const css = pos === 'bottom' ? { bottom: (s.y ?? 440) + 'px' } : { top: (s.y ?? (pos === 'mid' ? 620 : 250)) + 'px' };
  const b = mk(L, 'tx' + (s.center || pos === 'mid' ? ' c' : ''), null, css);
  const tag = s.tag ? mk(b, 'tag', s.tag) : null; const hd = mk(b, 'hd', s.lines.join('<br>'), s.size ? { fontSize: s.size + 'px' } : null); const ws = words(hd);
  const sub = s.sub ? mk(b, 'sub', s.sub) : null; const t0 = s.first ? -1 : 0.08;
  return (t) => { if (tag) fadeUp(tag, t, t0, 0.35, 18); slam(ws, t, t0, s.step || 0.11); if (sub) fadeUp(sub, t, t0 + 0.25 + ws.length * (s.step || 0.11), 0.5, 20); }; }

const B = {
  photo(s, L) { const bg = photo(L, s); mk(L, 'shade ' + (s.pos || 'bottom')); const tx = text(L, s, 'bottom'); const dur = s.dur || 2.2;
    return { dur, draw(t) { bg(E.outCubic(seg(t, 0, dur)) * 0.6 + 0.4 * seg(t, 0, dur)); tx(t); } }; },
  plate(s, L) { // food shot floating on the brand backdrop, headline above
    if (s.bg) { const bg = photo(L, { img: s.bg, z0: 1.1, z1: 1.2, fy: 0.5 }); L._bg = bg; }
    const im = document.createElement('img'); im.className = 'food' + (s.lit ? ' lit' : ''); im.src = src(s.img); L.appendChild(im); loads.push(im.decode().catch(() => {}));
    const top = s.ftop ?? 900, sc = s.fscale || 1; const tx = text(L, s, 'top'); const dur = s.dur || 2.2;
    return { dur, draw(t) { if (L._bg) L._bg(seg(t, 0, dur)); const k = E.outExpo(seg(t, s.first ? -1 : 0, 0.7)), m = seg(t, 0, dur);
      im.style.top = top + 'px'; im.style.opacity = k.toFixed(3);
      im.style.transform = `translateY(${((1 - k) * 260).toFixed(1)}px) scale(${(sc * (0.92 + 0.08 * k + 0.07 * m)).toFixed(4)}) rotate(${(lerp(s.r0 ?? -3, s.r1 ?? 2, E.inOutSine(m))).toFixed(2)}deg)`; tx(t); } }; },
  count(s, L) { // one giant number counting up over a photo
    const bg = photo(L, s, s.dim); mk(L, 'shade mid'); const n = +String(s.n).replace(/\D/g, ''); const top = s.top || 470;
    const num = mk(L, 'num', s.n, { top: top + 'px', fontSize: (s.nsize || 560) + 'px' });
    const tx = text(L, { ...s, pos: 'mid', y: top + (s.nsize || 560) * 0.95 + 30, first: false }, 'mid'); const dur = s.dur || 2.8, land = s.first ? 0 : 0.85;
    return { hits: s.first ? [] : [land], riser: s.first ? null : land, dur, draw(t) { bg(seg(t, 0, dur)); const k = s.first ? 1 : E.outExpo(seg(t, 0.05, land)), p = seg(t, land, land + 0.35);
      num.textContent = Math.round(n * k).toLocaleString('en-US'); setEl(num, { op: 1, s: 0.9 + 0.1 * k + 0.12 * Math.sin(p * Math.PI) * (1 - p) }); tx(Math.max(0, t - (s.first ? -2 : land - 0.2))); } }; },
  list(s, L) { // rows landing one by one over a dimmed photo
    const bg = photo(L, s, true); const tx = text(L, { ...s, center: true }, 'top');
    const box = mk(L, 'rows', null, { top: (s.top || 640) + 'px' });
    const rows = s.rows.map(([l, r], i) => mk(box, 'row', `<div class="lw">${s.numbered ? `<b>${i + 1}</b>` : ''}<div class="l">${l}</div></div>${r ? `<div class="r">${r}</div>` : ''}`));
    const a0 = 0.7, st = s.stagger || 0.38;
    return { pops: rows.map((_, i) => a0 + i * st + 0.05), dur: s.dur || (a0 + rows.length * st + 1.9), draw(t) { bg(seg(t, 0, this.dur)); tx(t);
      rows.forEach((el, i) => { const a = E.outExpo(seg(t, a0 + i * st, a0 + i * st + 0.5)); setEl(el, { op: a, x: (1 - a) * (i % 2 ? 120 : -120), s: 0.92 + 0.08 * a }); }); } }; },
  phone(s, L) { // the client's live site scrolling in a phone
    if (s.bg) { const bg = photo(L, { img: s.bg }, true); L._bg = bg; }
    const tx = text(L, { ...s, center: true }, 'top');
    const wrap = mk(L, 'pwrap', null, { top: (s.ptop || 560) + 'px' }); const p = mk(wrap, 'phone', `<div class="scr"><img src="${src(s.img || 'site')}"></div><div class="isl"></div>`);
    const img = $('img', p); loads.push(img.decode().catch(() => {})); const dur = s.dur || 3.2, sc = s.scroll || 1800;
    return { dur, draw(t) { if (L._bg) L._bg(seg(t, 0, dur)); const k = E.outExpo(seg(t, 0, 0.8)), m = seg(t, 0, dur); p.style.opacity = seg(t, 0, 0.2).toFixed(3);
      p.style.transform = `translateY(${((1 - k) * 420).toFixed(1)}px) rotateY(${lerp(-16, 10, E.inOutSine(m)).toFixed(2)}deg) rotateX(${(7 - 4 * m).toFixed(2)}deg) scale(${(0.96 + 0.06 * m).toFixed(4)})`;
      img.style.transform = `translateY(${(-(s.y0 || 0) - sc * E.inOut(seg(t, 0.4, dur - 0.1))).toFixed(1)}px)`; tx(t); } }; },
};

// ---- timeline: hard cuts with a punch-in; `whip: true` on a scene gives its entry a zoom-blur whip instead ----
const scenes = CFG.scenes.map((s) => { const L = mk(root, 'sc'); const b = B[s.type](s, L); return { L, whip: !!s.whip, ...b }; });
let T = 0; scenes.forEach((s) => { s.a = T; T += s.dur; });
const END = T, ENDDUR = 3.8; window.__DUR = END + ENDDUR;
const WHIPS = scenes.slice(1).filter((s) => s.whip).map((s) => s.a).concat([END]), HARD = scenes.slice(1).filter((s) => !s.whip).map((s) => s.a);
const HITS = [].concat(...scenes.map((s) => (s.hits || []).map((h) => s.a + h)));
window.__EVENTS = { cuts: WHIPS, hits: HITS, risers: [].concat(...scenes.map((s) => s.riser != null ? [s.a + s.riser] : [])),
  pops: HARD.concat(...scenes.map((s) => (s.pops || []).map((p) => s.a + p))).sort((a, b) => a - b), end: END, dur: END + ENDDUR };
const en = { ...BR.end, ...(CFG.end || {}) };
$('#e1').textContent = en.over; $('#e2').textContent = en.name; $('#e3').innerHTML = en.line; $('#ecta').textContent = en.cta; $('#eurl').textContent = en.url; $('#eby').textContent = 'Website by Round City · roundcity.co';
const WE = words($('#e2'));
window.__ready = document.fonts.ready.then(() => Promise.all(loads)).then(() => true);
window.seek = async (t) => {
  scenes.forEach((s, i) => { const lt = t - s.a; const on = lt >= 0 && lt < s.dur; s.L.style.opacity = on ? 1 : 0; s.L.style.visibility = on ? 'visible' : 'hidden'; if (on) s.draw(lt); });
  const te = t - END; $('#end').style.opacity = te >= 0 ? 1 : 0;
  if (te >= 0) { fadeUp($('#e1'), te, 0.1, 0.4, 20); slam(WE, te, 0.2, 0.1, 0.45); const r = E.outExpo(seg(te, 0.5, 1.1)); $('#erule').style.transform = `scaleX(${r.toFixed(3)})`;
    fadeUp($('#e3'), te, 0.75, 0.45, 20); const c = E.outExpo(seg(te, 1.1, 1.7)); $('#ecta').style.opacity = c.toFixed(3); $('#ecta').style.transform = `translateY(${((1 - c) * 40).toFixed(1)}px) scale(${(0.85 + 0.15 * c).toFixed(3)})`;
    fadeUp($('#eurl'), te, 1.4, 0.45, 16); const b = seg(te, 1.8, 2.3) * 0.7; $('#eby').style.opacity = b.toFixed(3); }
  let amt = 0, dir = 1; WHIPS.forEach((c) => { const d = t - c; if (Math.abs(d) < 0.24) { const a = 1 - Math.abs(d) / 0.24; if (a > amt) { amt = a; dir = d < 0 ? 1 : -1; } } }); amt = E.inOutSine(amt);
  let punch = 0; HARD.forEach((c) => { const d = t - c; if (d >= 0 && d < 0.3) punch = Math.max(punch, Math.pow(1 - d / 0.3, 3)); });
  let sx = 0, sy = 0; HITS.forEach((h) => { const d = t - h; if (d >= 0 && d < 0.45) { const k = Math.pow(1 - d / 0.45, 2); sx += Math.sin(d * 95) * 16 * k; sy += Math.cos(d * 80) * 12 * k; } });
  const sc = 1 + 0.14 * amt + 0.07 * punch; const R = te >= 0 ? $('#end') : root; root.style.transform = $('#end').style.transform = 'none'; root.style.filter = $('#end').style.filter = 'none';
  R.style.transform = `translate(${sx.toFixed(1)}px,${sy.toFixed(1)}px) scale(${sc.toFixed(4)}) rotate(${(dir * 1.6 * amt).toFixed(3)}deg)`; R.style.filter = amt > 0.01 ? `blur(${(amt * 12).toFixed(2)}px)` : 'none';
  const fl = Math.max(0, punch * 0.5, ...WHIPS.map((c) => 1 - Math.abs(t - c) / 0.16), ...HITS.map((h) => (t >= h ? 1 - (t - h) / 0.22 : 0))); $('#flash').style.opacity = (fl * 0.5).toFixed(3);
  grainJitter($('#grain'), t);
  await flushDecodes();
};
</script></body></html>
